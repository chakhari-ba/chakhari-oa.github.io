      const NAVY = [20, 35, 46], ORANGE = [210, 122, 34], STEEL = [44, 90, 122];
      let y = M;
      const need = h => { if (y + h > PH - 16) { doc.addPage(); y = M + 6; } };
      const H1 = t => { need(16); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...NAVY); doc.text(san(t), M, y + 6); doc.setDrawColor(...ORANGE); doc.setLineWidth(0.8); doc.line(M, y + 8.5, M + CW, y + 8.5); y += 13; };
      const H2 = t => { need(10); doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...STEEL); doc.text(san(t), M, y + 5); y += 8; };
      const table = (head, body, opts = {}) => {
        doc.autoTable(Object.assign({ head: head ? [head.map(san)] : undefined, body: body.map(r => Array.isArray(r) ? r.map(c => typeof c === 'object' && c ? Object.assign({}, c, { content: san(c.content) }) : san(c)) : r), startY: y, margin: { left: M, right: M, top: 18, bottom: 18 },
          styles: { font: 'helvetica', fontSize: 8, cellPadding: 1.4, lineColor: [214, 222, 228], lineWidth: 0.1, textColor: [28, 39, 48] },
          headStyles: { fillColor: NAVY, textColor: 255, fontStyle: 'bold' }, alternateRowStyles: { fillColor: [247, 249, 250] } }, opts));
        y = doc.lastAutoTable.finalY + 5;
      };
      const drawing = async str => {
        const vb = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(str), ratio = +vb[2] / +vb[1], h = CW * ratio;
        need(h + 2);
        let done = false;
        if (hasSvg) {
          const el = svgEl(str), host = document.createElement('div');
          host.style.cssText = 'position:fixed;left:-99999px;top:0;width:1180px'; host.appendChild(el); document.body.appendChild(host);
          try { await doc.svg(el, { x: M, y, width: CW, height: h }); done = true; } catch (e) { done = false; }
          host.remove();
        }
        if (!done) { const p = await svgToPng(str, 2); doc.addImage(p.url, 'PNG', M, y, CW, h); }
        y += h + 4;
      };
      // couverture
      doc.setFillColor(...NAVY); doc.rect(0, 0, PW, 92, 'F');
      doc.setFillColor(...ORANGE); doc.rect(0, 92, PW, 2.2, 'F');
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(40); doc.text('CHAKHARI', M, 38); doc.setTextColor(...ORANGE); doc.text('OA', M + doc.getTextWidth('CHAKHARI ') , 38);
      doc.setTextColor(220, 228, 234); doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.text('Conception des ponts courants selon les guides SETRA', M, 50);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(255); doc.text(doc.splitTextToSize(san('Rapport de conception – ' + D.titre), CW), M, 70);
      y = 104;
      table(null, projectRows().map(([a, b]) => [{ content: a, styles: { fontStyle: 'bold', fillColor: [238, 242, 245] } }, b]), { columnStyles: { 0: { cellWidth: 52 } } });
      H2('Variantes étudiées dans ce rapport');
      table(['Variante', 'Mode de construction', 'Domaine SETRA', 'Adéquation', 'Montant HT (DT)'], UI.repSel.map(id => { const r = S.R[id]; return [r.code, r.mode, r.dom, r.adeq, nf(r.HT, 0)]; }));
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(90, 106, 118);
      doc.text(san(`Établi par : ${D.auteur} – plateforme CHAKHARI OA conçue par M. Maher CHAKHARI`), M, y + 2); y += 8;
      // variantes
      for (const id of UI.repSel) {
        const r = S.R[id];
        doc.addPage(); y = M + 4;
        H1(`Variante ${r.code} – ${r.name}`);
        table(null, [['Mode de construction', r.mode, 'Domaine SETRA', r.dom], ['Adéquation à l\'obstacle', r.adeq, 'Portée déterminante', nf(r.Dd) + ' m'], ['Hauteur du tablier', nf(r.Htab) + ' m', 'Béton total', nf(r.Vtot, 1) + ' m3'],
          ['Aciers passifs', nf(r.As, 0) + ' kg', 'Précontrainte', nf(r.Ap, 0) + ' kg'], ['Montant HT', nf(r.HT, 0) + ' DT', 'Montant TTC', nf(r.TTC, 0) + ' DT']], { columnStyles: { 0: { fontStyle: 'bold', fillColor: [238, 242, 245] }, 2: { fontStyle: 'bold', fillColor: [238, 242, 245] } } });
        if (UI.repOpt.draw) { H2('Coupe longitudinale'); await drawing(DRAW.longi(r, D, S.dv, { ve: 1 })); H2('Coupe transversale'); await drawing(DRAW.trans(r, D, S.dv)); }
        if (UI.repOpt.calc) {
          H2('Calcul détaillé');
          const body = [];
          r.sections.forEach((s, i) => { body.push([{ content: `${i + 1}. ${s.t}`, colSpan: 4, styles: { fillColor: [227, 237, 244], textColor: STEEL, fontStyle: 'bold' } }]); s.rows.forEach(x => body.push([x[0], { content: String(typeof x[1] === 'number' ? fv(x[1], x[2]) : x[1]), styles: { halign: 'right' } }, x[2], x[3]])); });
          table(['Désignation', 'Valeur', 'Unité', 'Règle / observation'], body, { columnStyles: { 0: { cellWidth: 66 }, 1: { cellWidth: 24 }, 2: { cellWidth: 14 } } });
        }
        if (UI.repOpt.est) {
          H2('Estimation des prix (DT)');
          const e = estimateRows(r), body = [];
          const sec = t => body.push([{ content: t, colSpan: 5, styles: { fillColor: [227, 237, 244], textColor: STEEL, fontStyle: 'bold' } }]);
          const tot = (t, v) => body.push([{ content: t, colSpan: 4, styles: { fontStyle: 'bold', fillColor: [251, 235, 219] } }, { content: nf(v, 0), styles: { halign: 'right', fontStyle: 'bold', fillColor: [251, 235, 219] } }]);
          const line = x => body.push([x[0], x[1], { content: nf(x[2], x[1] === 'u' ? 0 : 2), styles: { halign: 'right' } }, { content: nf(x[3], 0), styles: { halign: 'right' } }, { content: nf(x[2] * x[3], 0), styles: { halign: 'right' } }]);
          sec('A. Gros œuvre et méthodes'); e.A.forEach(line); tot('Total A – gros œuvre', e.tA);
          sec('B. Équipements'); e.B.forEach(line); tot('Total B – équipements', e.tB);
          sec('C. Récapitulatif'); tot('Total des travaux (A + B)', e.T); tot(`Divers et imprévus (${nf(D.divers, 0)} %)`, e.div); tot('MONTANT TOTAL HT', e.HT); tot(`TVA (${nf(D.tva, 0)} %)`, e.tva); tot('MONTANT TOTAL TTC', e.TTC);
          table(['Désignation', 'Unité', 'Quantité', 'PU (DT HT)', 'Montant (DT HT)'], body, { columnStyles: { 0: { cellWidth: 82 } } });
        }
      }
      if (UI.repOpt.comp) {
        doc.addPage(); y = M + 4; H1('Comparaison des variantes');
        const sc = scoreAll();
        table(['Variante', ...CRIT.map(c => c[1]), 'Note', 'Montant HT'], OA.TYPES.map(t => { const o = sc.out[t.id]; return [t.short, ...CRIT.map(([c]) => nf(o.s[c], 1)), o.tot == null ? '—' : nf(o.tot, 0) + ' %', nf(S.R[t.id].HT, 0)]; }), { styles: { fontSize: 7.5, cellPadding: 1.2, font: 'helvetica' } });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(28, 39, 48);
        doc.text(doc.splitTextToSize(san(`Meilleure note multicritère : ${sc.best ? S.R[sc.best].code : 'aucune variante adaptée'}. Classement au coût pondéré : ${S.best ? S.R[S.best].code : '—'}. Notes de 0 à 5 ; pondérations : ${CRIT.map(([k, l]) => `${l} ${UI.weights[k]} %`).join(', ')}.`), CW), M, y + 2);
      }
      const np = doc.getNumberOfPages();
      for (let i = 1; i <= np; i++) {
        doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(110, 124, 135);
        if (i > 1) { doc.text(san(`CHAKHARI OA – ${D.titre}`), M, 9); doc.setDrawColor(214, 222, 228); doc.setLineWidth(0.2); doc.line(M, 10.5, PW - M, 10.5); }
        doc.text(san(`Établi par ${D.auteur} · ${new Date(D.date).toLocaleDateString('fr-FR')}`), M, PH - 8);
        doc.text(`Page ${i} / ${np}`, PW - M, PH - 8, { align: 'right' });
      }
      await saveFile(fileBase() + '.pdf', doc.output('blob'));
    } catch (e) { repMsg('Erreur lors de la création du PDF : ' + (e && e.message || e)); }
  }

  /* ---------------- Word ---------------- */
  async function makeDocx() {
    if (!UI.repSel.length) return repMsg('Choisir au moins une variante.');
    repMsg('Préparation du fichier Word…');
    const ok = await loadScript(['https://unpkg.com/docx@7.8.2/build/index.js', 'https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js', 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', 'https://unpkg.com/docx@8.5.0/build/index.umd.js'], () => window.docx && window.docx.Document && window.docx.Packer);
    if (!ok) return repMsg('Bibliothèque Word indisponible (réseau). Utiliser le PDF.');
    try {
      const X = window.docx;
      const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, ImageRun, AlignmentType, HeadingLevel, ShadingType, Footer, PageBreak } = X;
      const F = 'Calibri';
      const P_ = (t, o = {}) => new Paragraph({ spacing: { after: o.after ?? 80 }, alignment: o.align, children: [new TextRun({ text: String(t), font: F, size: o.size || 20, bold: o.bold, color: o.color, italics: o.it })] });
      const Hd = (t, lvl, col) => new Paragraph({ heading: lvl, spacing: { before: 240, after: 120 }, children: [new TextRun({ text: t, font: F, bold: true, size: lvl === HeadingLevel.HEADING_1 ? 30 : 24, color: col || '14232E' })] });
      const cell = (t, o = {}) => new TableCell({ columnSpan: o.span, shading: o.fill ? { type: ShadingType.CLEAR, color: 'auto', fill: o.fill } : undefined,
        children: [new Paragraph({ alignment: o.right ? AlignmentType.RIGHT : AlignmentType.LEFT, children: [new TextRun({ text: String(t), font: F, size: o.size || 17, bold: o.bold, color: o.color })] })] });
      const tbl = (head, rows) => new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [
        ...(head ? [new TableRow({ tableHeader: true, children: head.map(h => cell(h, { bold: true, fill: '14232E', color: 'FFFFFF' })) })] : []),
        ...rows.map(r => Array.isArray(r) ? new TableRow({ children: r }) : r) ] });
      const img = async str => { const p = await svgToPng(str, 2); const w = 600; return new Paragraph({ children: [new ImageRun({ data: p.buf, transformation: { width: w, height: Math.round(w * p.h / p.w) } })] }); };
      const ch = [];
      ch.push(new Paragraph({ shading: { type: ShadingType.CLEAR, color: 'auto', fill: '14232E' }, spacing: { after: 0 }, children: [new TextRun({ text: 'CHAKHARI ', font: F, size: 64, bold: true, color: 'FFFFFF' }), new TextRun({ text: 'OA', font: F, size: 64, bold: true, color: 'D27A22' })] }));
      ch.push(new Paragraph({ shading: { type: ShadingType.CLEAR, color: 'auto', fill: '14232E' }, spacing: { after: 240 }, children: [new TextRun({ text: 'Conception des ponts courants selon les guides SETRA', font: F, size: 24, color: 'DCE4EA' })] }));
      ch.push(Hd('Rapport de conception – ' + D.titre, HeadingLevel.HEADING_1));
      ch.push(tbl(null, projectRows().map(([a, b]) => new TableRow({ children: [cell(a, { bold: true, fill: 'EEF2F5' }), cell(b)] }))));
      ch.push(P_(''));
      ch.push(Hd('Variantes étudiées', HeadingLevel.HEADING_2, '2C5A7A'));
      ch.push(tbl(['Variante', 'Mode de construction', 'Domaine SETRA', 'Adéquation', 'Montant HT (DT)'], UI.repSel.map(id => { const r = S.R[id]; return [cell(r.code, { bold: true }), cell(r.mode), cell(r.dom), cell(r.adeq), cell(nf(r.HT, 0), { right: true })]; })));
      ch.push(P_(`Établi par : ${D.auteur} – plateforme CHAKHARI OA conçue par M. Maher CHAKHARI`, { it: true, size: 18, color: '5A6A76' }));
      for (const id of UI.repSel) {
        const r = S.R[id];
        ch.push(new Paragraph({ children: [new PageBreak()] }));
        ch.push(Hd(`Variante ${r.code} – ${r.name}`, HeadingLevel.HEADING_1));
        ch.push(tbl(null, [[['Mode de construction', r.mode], ['Domaine SETRA', r.dom]], [['Adéquation', r.adeq], ['Portée déterminante', nf(r.Dd) + ' m']], [['Hauteur du tablier', nf(r.Htab) + ' m'], ['Béton total', nf(r.Vtot, 1) + ' m³']], [['Montant HT', money(r.HT)], ['Montant TTC', money(r.TTC)]]]
          .map(pr => new TableRow({ children: pr.flatMap(([a, b]) => [cell(a, { bold: true, fill: 'EEF2F5' }), cell(b)]) }))));
        if (UI.repOpt.draw) { ch.push(Hd('Coupe longitudinale', HeadingLevel.HEADING_2, '2C5A7A')); ch.push(await img(DRAW.longi(r, D, S.dv, { ve: 1 }))); ch.push(Hd('Coupe transversale', HeadingLevel.HEADING_2, '2C5A7A')); ch.push(await img(DRAW.trans(r, D, S.dv))); }
        if (UI.repOpt.calc) {
          ch.push(Hd('Calcul détaillé', HeadingLevel.HEADING_2, '2C5A7A'));
          const rows = [];
          r.sections.forEach((s, i) => { rows.push([cell(`${i + 1}. ${s.t}`, { span: 4, bold: true, fill: 'E3EDF4', color: '2C5A7A' })]); s.rows.forEach(x => rows.push([cell(x[0]), cell(typeof x[1] === 'number' ? fv(x[1], x[2]) : x[1], { right: true }), cell(x[2]), cell(x[3], { size: 15, color: '5A6A76' })])); });
          ch.push(tbl(['Désignation', 'Valeur', 'Unité', 'Règle / observation'], rows));
        }
        if (UI.repOpt.est) {
          ch.push(Hd('Estimation des prix (DT)', HeadingLevel.HEADING_2, '2C5A7A'));
          const e = estimateRows(r), rows = [];
          const sec = t => rows.push([cell(t, { span: 5, bold: true, fill: 'E3EDF4', color: '2C5A7A' })]);
          const tot = (t, v) => rows.push([cell(t, { span: 4, bold: true, fill: 'FBEBDB' }), cell(nf(v, 0), { right: true, bold: true, fill: 'FBEBDB' })]);
          const line = x => rows.push([cell(x[0]), cell(x[1]), cell(nf(x[2], x[1] === 'u' ? 0 : 2), { right: true }), cell(nf(x[3], 0), { right: true }), cell(nf(x[2] * x[3], 0), { right: true })]);
          sec('A. Gros œuvre et méthodes'); e.A.forEach(line); tot('Total A – gros œuvre', e.tA);
          sec('B. Équipements'); e.B.forEach(line); tot('Total B – équipements', e.tB);
          sec('C. Récapitulatif'); tot('Total des travaux (A + B)', e.T); tot(`Divers et imprévus (${nf(D.divers, 0)} %)`, e.div); tot('MONTANT TOTAL HT', e.HT); tot(`TVA (${nf(D.tva, 0)} %)`, e.tva); tot('MONTANT TOTAL TTC', e.TTC);
          ch.push(tbl(['Désignation', 'Unité', 'Quantité', 'PU (DT HT)', 'Montant (DT HT)'], rows));
        }
      }
      if (UI.repOpt.comp) {
        const sc = scoreAll();
        ch.push(new Paragraph({ children: [new PageBreak()] }));
        ch.push(Hd('Comparaison des variantes', HeadingLevel.HEADING_1));
        ch.push(tbl(['Variante', ...CRIT.map(c => c[1]), 'Note', 'Montant HT'], OA.TYPES.map(t => { const o = sc.out[t.id]; const f = t.id === sc.best ? 'DDF1E5' : undefined; return [cell(t.short, { bold: true, fill: f }), ...CRIT.map(([c]) => cell(nf(o.s[c], 1), { right: true, fill: f })), cell(o.tot == null ? '—' : nf(o.tot, 0) + ' %', { right: true, fill: f }), cell(nf(S.R[t.id].HT, 0), { right: true, fill: f })]; })));
        ch.push(P_(`Meilleure note multicritère : ${sc.best ? S.R[sc.best].code : 'aucune variante adaptée'}. Classement au coût pondéré : ${S.best ? S.R[S.best].code : '—'}.`, { size: 18 }));
      }
      const doc = new Document({ creator: 'CHAKHARI OA', title: 'Rapport de conception – ' + D.titre, sections: [{ properties: {}, footers: { default: new Footer({ children: [P_(`CHAKHARI OA – établi par ${D.auteur} – ${new Date(D.date).toLocaleDateString('fr-FR')}`, { size: 16, color: '6E7C87' })] }) }, children: ch }] });
      const blob = await Packer.toBlob(doc);
      await saveFile(fileBase() + '.docx', blob);
    } catch (e) { repMsg('Erreur lors de la création du fichier Word : ' + (e && e.message || e)); }
  }

  async function exportCsv() {
    const list = (ADMIN_ROWS || []).flatMap(p => (p.visites || [])).sort((a, b) => b.t - a.t);
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = '\ufeffDate;Heure;Nom;Prénom;E-mail\n' + list.map(v => { const d = new Date(v.t); return [d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR'), v.nom, v.prenom, v.email].map(q).join(';'); }).join('\n');
    await saveFile('registre_acces_CHAKHARI_OA.csv', new Blob([csv], { type: 'text/csv' }), toast);
  }

  /* ---------------- accès et session ---------------- */
  const CAP = { ready: false, db: null, user: null, dl: null, canEdit: false, uid: null, inClaude: false };
  const getSess = () => { const s = LS.get('oa-session'); return s && s.exp > Date.now() ? s : null; };
  function renderSess() {
    const s = getSess(), el = $('#sess');
    if (CAP.canEdit && !s) { el.innerHTML = `<span class="pill">Administrateur</span>`; return; }
    if (!s) { el.innerHTML = ''; return; }
    const m = Math.max(0, Math.round((s.exp - Date.now()) / 60000));
    el.innerHTML = `<span class="who">Connecté : <b>${esc(s.prenom)} ${esc(s.nom.toUpperCase())}</b></span><span class="pill num"><span class="lbl">Session : </span>${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}</span><button class="btn-ghost" type="button" id="logout">Quitter</button>`;
  }
  function gateCheck() {
    const s = getSess();
    const open = !s && !CAP.canEdit && !ADM_KEY && current !== 'admin';
    const ab = $('#g-admin'); if (ab) ab.hidden = !REGISTRE_URL || CAP.inClaude;
    $('#gate').hidden = !open;
    document.querySelectorAll('#tabs a[data-id="admin"]').forEach(a => a.classList.toggle('lock', !CAP.canEdit && !ADM_KEY && !(REGISTRE_URL && !CAP.inClaude)));
    renderSess();
    if (open) setTimeout(() => { const f = $('#g-nom'); if (f && document.activeElement !== f) f.focus(); }, 50);
  }
  async function logAccess(s) {
    if (!CAP.db || !CAP.uid) {
      if (!REGISTRE_URL) return false;
      try { await fetch(REGISTRE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'log', t: s.start, nom: s.nom, prenom: s.prenom, email: s.email }) }); return true; } catch (e) { return false; }
    }
    try {
      const ref = CAP.db.doc('acces/' + CAP.uid);
      const snap = await ref.get();
      const prev = snap.exists ? snap.data() : {};
      const vis = (prev.visites || []).slice(-299);
      vis.push({ t: s.start, nom: s.nom, prenom: s.prenom, email: s.email });
      await ref.set({ nom: s.nom, prenom: s.prenom, email: s.email, premiere: prev.premiere || s.start, derniere: s.start, nb: (prev.nb || 0) + 1, visites: vis });
      return true;
    } catch (e) { return false; }
  }
  $('#gateForm').addEventListener('submit', async e => {
    e.preventDefault();
    const nom = $('#g-nom').value.trim(), prenom = $('#g-prenom').value.trim(), email = $('#g-mail').value.trim();
    const err = $('#g-err');
    if (!nom || !prenom) { err.textContent = 'Saisir votre nom et votre prénom.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = 'Saisir une adresse e-mail valide (exemple : nom@domaine.tn).'; return; }
    err.textContent = '';
    const start = Date.now(), s = { nom, prenom, email, start, exp: start + SESSION_MS };
    LS.set('oa-session', s);
    gateCheck();
    const logged = await logAccess(s);
    toast(logged ? `Bienvenue ${prenom} : session ouverte pour 3 heures.` : `Bienvenue ${prenom} : session ouverte pour 3 heures (registre indisponible dans cette vue).`);
  });
  $('#g-admin').addEventListener('click', () => { location.hash = '#admin'; });
  $('#sess').addEventListener('click', e => { if (e.target.id === 'logout') { LS.del('oa-session'); gateCheck(); } });
  setInterval(() => { renderSess(); if (!getSess() && !CAP.canEdit && $('#gate').hidden) gateCheck(); }, 30000);
  // l'administrateur connecté hors Claude n'a pas à remplir le formulaire visiteur
  const gateAdmin = () => !!ADM_KEY;

  (async () => {
    const C = window.claude;
    if (C && C.use) {
      const [user, db, dl] = await Promise.all([C.use('user').catch(() => null), C.use('db').catch(() => null), C.use('downloads').catch(() => null)]);
      CAP.user = user; CAP.db = db; CAP.dl = dl; CAP.inClaude = !!(user || db || dl);
      if (user) { try { CAP.canEdit = !!(await user.canEdit()); } catch (e) { } try { CAP.uid = await user.id(); } catch (e) { } }
      if (CAP.canEdit && db) {
        db.collection('acces').onSnapshot(snap => { ADMIN_ROWS = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); if (current === 'admin') dynAdmin(); }, () => { ADMIN_ROWS = []; if (current === 'admin') dynAdmin(); });
      }
    }
    CAP.ready = true;
    gateCheck();
    if (current === 'admin') dynAdmin();
  })();

  gateCheck();
  show(location.hash.slice(1) || 'accueil');
})();

</script>
