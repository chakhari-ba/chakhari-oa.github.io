<head>

</script>
<style>html,body{margin:0} body{font-size:14px} img{max-width:100%}</style>
<style>
/* Plateforme d'ingénierie : bandeau-titre de chantier, onglets numérotés, écran partagé saisie | dessin */
:root {
  --bg: #EEF1F3; --surface: #FFFFFF; --surface-2: #F6F8F9; --ink: #15212A; --muted: #5A6A76; --line: #D6DEE4;
  --accent: #D27A22; --accent-ink: #8A4710; --accent-soft: #FBEBDB; --steel: #2C5A7A; --steel-soft: #E3EDF4;
  --ok: #23804F; --ok-soft: #DDF1E5; --warn: #A86A12; --warn-soft: #FBEFD6; --bad: #B83A2E; --bad-soft: #F8E0DD;
  --hero: #14232E; --hero-ink: #F2F5F7; --shadow: 0 1px 2px rgba(20,35,46,.06), 0 6px 18px rgba(20,35,46,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F161B; --surface: #172028; --surface-2: #1C2730; --ink: #E5EBEF; --muted: #93A3AE; --line: #2A3843;
  --accent: #E99448; --accent-ink: #F6C08E; --accent-soft: #3A2716; --steel: #8BB8D8; --steel-soft: #1D3242;
  --ok: #5CC28A; --ok-soft: #16301F; --warn: #E2B04F; --warn-soft: #33290F; --bad: #EE7D70; --bad-soft: #3A1C19;
  --hero: #0A1116; --hero-ink: #F2F5F7; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F161B; --surface: #172028; --surface-2: #1C2730; --ink: #E5EBEF; --muted: #93A3AE; --line: #2A3843;
  --accent: #E99448; --accent-ink: #F6C08E; --accent-soft: #3A2716; --steel: #8BB8D8; --steel-soft: #1D3242;
  --ok: #5CC28A; --ok-soft: #16301F; --warn: #E2B04F; --warn-soft: #33290F; --bad: #EE7D70; --bad-soft: #3A1C19;
  --hero: #0A1116; --hero-ink: #F2F5F7; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hero) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em }
a { color: var(--steel) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num, td.v, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

/* ---------- en-tête ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--hero); color: var(--hero-ink) }
.top-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: .08em; white-space: nowrap; display: flex; align-items: center; gap: 10px; color: var(--hero-ink); text-decoration: none }
.brand i { display: inline-block; width: 30px; height: 18px; border-top: 4px solid var(--accent); border-radius: 50% 50% 0 0 / 100% 100% 0 0; position: relative }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 11px; letter-spacing: .04em; opacity: .7; text-transform: none }
.top .spacer { flex: 1 }
.sess { display: flex; align-items: center; gap: 10px; font-size: 12.5px; opacity: .92; min-width: 0 }
.sess b { font-weight: 600 }
.sess .pill { background: rgba(255,255,255,.1); border-radius: 99px; padding: 3px 10px; white-space: nowrap }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.28); color: var(--hero-ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12.5px }
.btn-ghost:hover { border-color: var(--accent) }
nav.tabs { background: var(--hero); border-top: 1px solid rgba(255,255,255,.08) }
.tabs-in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; max-width: 1480px; margin: 0 auto; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)) }
.tabs a { flex: none; display: flex; align-items: baseline; gap: 6px; color: #B9C6CF; text-decoration: none; padding: 9px 11px 10px; font-size: 13px; font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap }
.tabs a span { font-family: var(--f-mono); font-size: 10.5px; opacity: .6 }
.tabs a:hover { color: #fff }
.tabs a[aria-current="page"] { color: #fff; border-bottom-color: var(--accent) }
.tabs a.lock { opacity: .55 }

main { max-width: 1480px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
section.view { display: grid; gap: 18px }
section.view > *, .grid > *, .card-b { min-width: 0 }
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; justify-content: space-between }
.view-head h2 { font-size: 34px; font-weight: 700; line-height: 1 }
.view-head h2 .code { color: var(--accent) }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 75ch }
.eyebrow { font-family: var(--f-body); font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0 }
.card > h3, .card-h { font-size: 19px; font-weight: 700; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; justify-content: space-between }
.card-b { padding: 14px 16px }
.grid { display: grid; gap: 16px }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)) }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)) }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)) }

/* ---------- formulaires ---------- */
.form { display: grid; gap: 9px }
.fld { display: grid; grid-template-columns: minmax(0, 1fr) minmax(108px, 150px); align-items: center; gap: 4px 10px }
.fld label { font-size: 13px; color: var(--ink) }
.fld .hint { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); margin-top: -3px }
.inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); overflow: hidden }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.inp input, .inp select { border: 0; background: transparent; padding: 6px 8px; width: 100%; min-width: 0; outline: none; font-family: var(--f-mono); font-size: 13px }
.inp select { font-family: var(--f-body); cursor: pointer }
.inp input[type=text], .inp input[type=date] { font-family: var(--f-body) }
.inp .u { font-size: 11.5px; color: var(--muted); padding: 0 8px 0 0; white-space: nowrap }
.fld.wide { grid-template-columns: minmax(0, 1fr) minmax(150px, 230px) }
.calc { font-family: var(--f-mono); font-size: 13px; padding: 6px 8px; border-radius: 6px; background: var(--steel-soft); color: var(--steel); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.fs-title { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin: 8px 0 2px; padding-top: 8px; border-top: 1px dashed var(--line) }
.fs-title:first-child { border-top: 0; margin-top: 0; padding-top: 0 }

/* ---------- tableaux ---------- */
.tbl-wrap { overflow-x: auto }
table.t { width: 100%; border-collapse: collapse; font-size: 13px }
table.t th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--line); background: var(--surface-2); position: sticky; top: 0 }
table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
table.t td.v { text-align: right; white-space: nowrap }
table.t td.u { color: var(--muted); white-space: nowrap; font-size: 12px }
table.t td.r { color: var(--muted); font-size: 12px }
table.t tr.sec td { background: var(--steel-soft); color: var(--steel); font-weight: 600; font-family: var(--f-display); font-size: 16px; letter-spacing: .02em }
table.t tr.tot td { font-weight: 600; background: var(--accent-soft) }
table.t tr.tot td.v { color: var(--accent-ink) }
table.t tr.hl td { background: var(--accent-soft) }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50% ; background: currentColor }
.fld .pill { white-space: normal; justify-self: start }
.p-ok { background: var(--ok-soft); color: var(--ok) } .p-warn { background: var(--warn-soft); color: var(--warn) } .p-bad { background: var(--bad-soft); color: var(--bad) } .p-n { background: var(--steel-soft); color: var(--steel) }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13.5px; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1B1006 }
.btn.primary:hover { filter: brightness(1.05) }
.btn.steel { background: var(--steel); border-color: var(--steel); color: var(--surface) }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 12.5px }
.seg button[aria-pressed="true"] { background: var(--steel); color: var(--surface) }

/* ---------- accueil ---------- */
.hero { position: relative; overflow: hidden; border-radius: 14px; background: var(--hero); color: var(--hero-ink); padding: clamp(24px, 4vw, 52px) clamp(18px, 4vw, 56px) 0 }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(64px, 11vw, 150px); line-height: .86; letter-spacing: .02em }
.hero h1 em { font-style: normal; color: var(--accent) }
.hero .tag { font-family: var(--f-display); font-weight: 500; font-size: clamp(18px, 2.2vw, 26px); letter-spacing: .04em; color: #C9D5DD; margin-top: 10px }
.hero p.role { max-width: 104ch; color: #D8E1E7; font-size: 15.5px; margin: 18px 0 0 }
.hero .deck { display: block; width: 100%; height: auto; margin-top: 18px; color: #3E5566 }
.hero .kpis { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 18px }
.hero .kpis div { font-size: 12px; color: #A9B8C3; letter-spacing: .04em }
.hero .kpis b { display: block; font-family: var(--f-mono); font-size: 17px; color: #fff; font-weight: 500 }
.creator { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start }
.mono-badge { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #1B1006; font-family: var(--f-display); font-weight: 800; font-size: 32px; letter-spacing: .02em }
.creator p { margin: 6px 0 0; max-width: 78ch }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px }
.tcard { display: grid; gap: 6px; padding: 14px 16px 16px; text-decoration: none; color: var(--ink); transition: transform .15s, border-color .15s }
.tcard:hover { transform: translateY(-2px); border-color: var(--accent) }
.tcard .ico { width: 100%; height: 52px; color: var(--steel) }
.tcard .code { font-family: var(--f-display); font-size: 24px; font-weight: 700; color: var(--accent-ink) }
.tcard .nm { font-size: 13px; color: var(--muted); min-height: 2.6em }
.tcard .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px }
.tcard .go { color: var(--steel); font-weight: 600 }

/* ---------- écran partagé ---------- */
.split { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 1050px) { .split { grid-template-columns: minmax(0, 1fr) } }
.split .left { display: grid; gap: 16px; position: sticky; top: 112px; max-height: calc(100vh - 128px); overflow: auto; padding-right: 2px }
@media (max-width: 1050px) { .split .left { position: static; max-height: none } }
.draw { display: grid; gap: 14px; min-width: 0 }
.draw > *, .split > * { min-width: 0 }
.svgbox { min-width: 0; max-width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); background: #FBFCFD }
.svgbox svg { display: block; width: 100%; height: auto; min-width: 640px }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface) }
.strip div { padding: 10px 14px; border-right: 1px solid var(--line) }
.strip div:last-child { border-right: 0 }
.strip small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.strip b { font-family: var(--f-mono); font-weight: 500; font-size: 17px }
details.calc-d > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center }
details.calc-d > summary::-webkit-details-marker { display: none }
details.calc-d > summary::after { content: "+"; font-family: var(--f-mono); font-size: 18px; color: var(--muted) }
details.calc-d[open] > summary::after { content: "−" }

/* ---------- comparaison ---------- */
.score-bar { height: 8px; border-radius: 4px; background: var(--steel-soft); overflow: hidden; min-width: 80px }
.score-bar i { display: block; height: 100%; background: var(--steel) }
.best td { background: var(--ok-soft) !important }
.stars { font-family: var(--f-mono); letter-spacing: 1px; color: var(--accent) }

/* ---------- rapport ---------- */
.rep-doc { overflow-x: auto; background: #fff; color: #1c2730; border-radius: 6px; padding: 28px 32px; border: 1px solid var(--line); max-width: 980px }
.rep-doc h1 { font-family: var(--f-display); font-size: 34px; color: #14232E }
.rep-doc h2 { font-family: var(--f-display); font-size: 24px; color: #14232E; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #D27A22 }
.rep-doc h3 { font-family: var(--f-display); font-size: 18px; color: #2C5A7A; margin: 14px 0 6px }
.rep-doc table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0 10px }
.rep-doc th, .rep-doc td { border: 1px solid #D6DEE4; padding: 4px 7px; text-align: left }
.rep-doc th { background: #EEF2F5 }
.rep-doc td.v { text-align: right; font-family: var(--f-mono) }
.rep-doc tr.sec td { background: #E3EDF4; font-weight: 600; color: #2C5A7A }
.rep-doc .svgbox { border-color: #D6DEE4 }
.checks { display: flex; flex-wrap: wrap; gap: 8px }
.chk { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; background: var(--surface); cursor: pointer; font-size: 13px }
.chk input { accent-color: var(--accent) }
.msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; background: var(--steel-soft); color: var(--steel) }
.msg.bad { background: var(--bad-soft); color: var(--bad) } .msg.ok { background: var(--ok-soft); color: var(--ok) }

/* ---------- règles ---------- */
.rules { display: grid; gap: 12px }
.rule-card h3 { font-size: 22px }
.rule-card dl { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 6px 16px; margin: 0 }
.rule-card dt { font-weight: 600; color: var(--steel); font-size: 13px }
.rule-card dd { margin: 0; font-size: 13.5px }
@media (max-width: 640px) { .rule-card dl { grid-template-columns: minmax(0, 1fr) } }

/* ---------- accès ---------- */
.gate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--hero) 88%, transparent); backdrop-filter: blur(6px); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.gate-box { width: min(460px, 100%); background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35) }
.gate-head { background: var(--hero); color: var(--hero-ink); padding: 22px 24px 18px }
.gate-head h2 { font-size: 40px; font-weight: 800; letter-spacing: .06em }
.gate-head h2 em { font-style: normal; color: var(--accent) }
.gate-head p { margin: 4px 0 0; color: #C9D5DD; font-size: 13px }
.gate form { padding: 20px 24px 22px; display: grid; gap: 12px }
.gate label { display: grid; gap: 4px; font-size: 13px; font-weight: 500 }
.gate input { border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; background: var(--surface-2) }
.gate input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.gate .err { color: var(--bad); font-size: 12.5px; min-height: 1em }
.gate small { color: var(--muted); font-size: 11.5px }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--hero); color: var(--hero-ink); padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); max-width: min(420px, calc(100vw - 32px)) }
@media print {
  .top, nav.tabs, .no-print, .toast, .gate, .view-head { display: none !important }
  body { background: #fff } main { padding: 0; max-width: none } .card { border: 0; box-shadow: none } .card > h3 { display: none }
  .rep-doc { border: 0; padding: 0; max-width: none } .rep-doc h2 { break-before: page } .rep-doc h2:first-of-type { break-before: auto }
  .svgbox { break-inside: avoid } .svgbox svg { min-width: 0 } .rep-doc tr { break-inside: avoid }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
@media (max-width: 640px) { .view-head h2 { font-size: 28px } .sess .who { display: none } .brand small { display: none } .brand { font-size: 19px; gap: 7px } .brand i { width: 22px } .sess { gap: 6px; font-size: 11px } .sess .pill { padding: 2px 7px } .sess .lbl { display: none } .brand i { display: none } .rep-doc { padding: 14px } .top-in { gap: 8px } }
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <a class="brand" href="#accueil"><i></i>CHAKHARI OA <small>Conception des ponts – guides SETRA</small></a>
    <div class="spacer"></div>
    <div class="sess" id="sess"></div>
  </div>
  <nav class="tabs" aria-label="Onglets"><div class="tabs-in" id="tabs"></div></nav>
</header>
<main id="main"></main>
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <div class="gate-head"><h2>CHAKHARI <em>OA</em></h2><p>Conception des ponts courants selon les guides SETRA</p></div>
    <form id="gateForm" novalidate>
      <label for="g-nom">Nom<input id="g-nom" autocomplete="family-name" required></label>
      <label for="g-prenom">Prénom<input id="g-prenom" autocomplete="given-name" required></label>
      <label for="g-mail">Adresse e-mail<input id="g-mail" type="email" autocomplete="email" required></label>
      <div class="err" id="g-err"></div>
      <button class="btn primary" type="submit" style="justify-content:center">Accéder à la plateforme (session de 3 h)</button>
      <small>Votre nom, votre prénom, votre e-mail et l'horaire de connexion sont enregistrés dans le registre d'accès consulté par l'administrateur.</small>
      <button class="btn" type="button" id="g-admin" hidden style="justify-content:center">Accès administrateur</button>
    </form>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== CHAKHARI OA – moteur de calcul (règles du classeur « Conception des ponts OA ») ===================== */
const OA = (() => {
  const EPS = 1e-9;
  const ceilS = (x, s) => Math.ceil(x / s - EPS) * s;
  const floorS = (x, s) => Math.floor(x / s + EPS) * s;
  const mround = (x, s) => Math.round(x / s) * s;
  const roundup = x => Math.ceil(x - EPS);
  const xround = x => Math.sign(x) * Math.round(Math.abs(x) + EPS);
  const int = x => Math.floor(x + EPS);
  const PI = Math.PI;
  const r6 = x => Math.round(x * 1e6) / 1e6;

  const ARTIF = ['Autoroute', 'Route', 'Giratoire', 'Ligne ferrée'];
  const NATURES = ['Autoroute', 'Route', 'Giratoire', 'Ligne ferrée', 'Oued', 'Rivière', 'Fleuve', 'Mer', 'Canal', 'Ravin / vallée'];

  const TYPES = [
    { id: 'psida', code: 'PSI-DA', short: 'PSI-DA', name: 'Pont-dalle en béton armé', range: '6 – 18 m', mode: 'Coulé en place', tab: 3 },
    { id: 'psiba', code: 'PSI-BA', short: 'PSI-BA', name: 'Pont à poutres continues en béton armé', range: '10 – 20 m', mode: 'Coulé en place', tab: 4 },
    { id: 'cadres', code: 'Cadres-Portiques', short: 'Cadres', name: 'Cadres et portiques (PICF / PIPO / POD)', range: '5 – 22 m', mode: 'Coulé en place', tab: 5 },
    { id: 'tiba', code: 'TI-BA', short: 'TI-BA', name: 'Travées indépendantes à poutres préfabriquées en BA', range: '10 – 22 m', mode: 'Préfabriqué', tab: 6 },
    { id: 'psidp', code: 'PSI-DP', short: 'PSI-DP', name: 'Pont-dalle en béton précontraint', range: '14 – 25 m (30 m)', mode: 'Coulé en place', tab: 7 },
    { id: 'psidn', code: 'PSI-DN', short: 'PSI-DN', name: 'Pont en dalle nervurée précontrainte', range: '20 – 50 m', mode: 'Coulé en place', tab: 8 },
    { id: 'vipp', code: 'VIPP', short: 'VIPP', name: 'Viaduc à poutres préfabriquées précontraintes (post-tension)', range: '30 – 45 m (50 m)', mode: 'Préfabriqué', tab: 9 },
    { id: 'caisson', code: 'Caisson-Enc', short: 'Encorbellements', name: 'Pont-caisson construit par encorbellements successifs', range: '60 – 150 m', mode: 'Encorbellements successifs', tab: 10 },
  ];

  const D0 = {
    titre: 'Passage supérieur – projet type', lieu: 'Tunisie', mo: '—', auteur: 'M. Chakhari', date: new Date().toISOString().slice(0, 10),
    nature: 'Giratoire', emprise: 64, margeAuto: 'Auto', marge: 2, Hc: 5, Hp: 5, Hlibre: 4.75, remblai: 1.5,
    sol: 'Bon', solType: 'Sable argileux compact', qadm: 0.25, substratum: 12, nappe: 'Non', agress: 'Non agressif',
    phe: 2.0, revanche: 1.0,
    zoneClim: 'Méditerranéen (littoral)', tmin: 0, tmax: 45, gradT: 12, vent: 'Région II', seisme: 'Zone de sismicité faible',
    milieu: 'Urbain', expo: 'XC4', enrobage: 3,
    nv: 2, lv: 3.5, trot: 'A droite', ltrot: 1.5, ret: 1, surl: 1,
    mgg: 0.3, hchevC: 1.2, hchevP: 1.2, dcol: 1, hcorb: 0.45, lcorb: 0.3, hsem: 1.5, dpieu: 1, Lpieu: 15, jr: 0.05, ji: 0.1,
    eTrot: 0.2, corn: 0.15, eDT: 0.3, LDT: 4,
    rCul: 100, rPil: 100, rSem: 60, rPx: 100,
    pBA: 470, pFond: 500, pHA: 6, pBP: 15, pCoff: 35, pCintre: 45, pPrefa: 150, pEnc: 1500,
    pAppBA: 700, pAppBP: 1000, pAppPot: 6000, pJR: 400, pJI: 600, pRet: 250, pTrot: 400, pCorn: 900, pDT: 800,
    divers: 10, tva: 19,
  };

  const P0 = {
    psiba: { Pmax: 20, Lmax: 70, th: 0.75, d: 0.35, crit: 'Sécuritaire', hd: 0.2, be: 0.2, rP: 180, rE: 120, rH: 100 },
    psida: { Pmax: 18, Lmax: 70, th: 0.75, d: 0.35, hb: 0.25, rD: 110 },
    cadres: { cfg: 'Voie portée sur le cadre', surlong: 2, bsem: 2.5, eAile: 0.3, rC: 100 },
    tiba: { Pmax: 22, d: 0.35, crit: 'Économique', hd: 0.2, be: 0.2, ep: 0.05, rP: 150, rE: 100, rH: 80, rPr: 25 },
    psidp: { Pmax: 25, Lmax: 90, th: 0.75, d: 0.5, sec: 'Auto', enc: 'Oui', Bd: 0.25, rS: 100, rPc: 30 },
    psidn: { Pmax: 40, Lmax: 150, th: 0.75, d: 0.5, nerv: 'Larges', iner: 'Auto', rPc: '' },
    vipp: { Pmax: 40, d: 0.5, crit: 'Compromis', hd: 0.2, ba: 0.2, bt: 0.7, h2: 0.25, rP: 110, rH: 175, rE: 120, rPc: 40 },
    caisson: { Pmax: 150, Lmax: 2000, th: 0.62, d: 0.5, ts: 0.25, ta: 0.45, lv: 4, lvsp: 8, rS: 110, rPc: 45 },
  };

  function derive(D) {
    const cat = ARTIF.includes(D.nature) ? 'Artificiel' : 'Naturel';
    const marge = D.margeAuto === 'Auto' ? (cat === 'Artificiel' ? 2 : 0) : +D.marge;
    const L = D.emprise + 2 * marge;
    const Wroul = D.nv * D.lv;
    const Wtrot = D.trot === '2 côtés' ? 2 * D.ltrot : (D.trot === 'Sans' ? 0 : D.ltrot);
    const B = Wroul + Wtrot + D.ret + D.surl;
    const LDTsetra = Math.min(6, Math.max(3, 0.6 * D.Hc));
    return { cat, marge, L, Wroul, Wtrot, B, LDTsetra };
  }

  /* ---------- profils longitudinaux ---------- */
  function profCont(L, D, p, caisson) {
    const Ntr = Math.max(1, roundup(L / p.Lmax));
    const Lt = (L - 2 * D.jr - (Ntr - 1) * D.ji) / Ntr;
    const Lnet = Lt - 2 * p.d;
    let n;
    if (caisson) n = Math.max(3, roundup(Lnet / p.Pmax - 2 * p.th + 2));
    else n = Lnet <= p.Pmax ? 1 : (Lnet / 2 <= p.Pmax ? 2 : Math.max(3, roundup(Lnet / p.Pmax - 2 * p.th + 2)));
    const Lc = n === 1 ? Lnet : (n === 2 ? Lnet / 2 : mround(Lnet / (2 * p.th + n - 2), 0.05));
    const L1 = n <= 2 ? Lc : (Lnet - (n - 2) * Lc) / 2;
    const thr = L1 / Lc;
    const thOk = n < 3 ? 'Sans objet' : (thr >= 0.5 && thr <= 0.9 ? 'OK' : 'À revoir');
    const Dd = Math.max(L1, Lc);
    const ntot = Ntr * n, np = ntot - 1, nd = Ntr - 1, Ltot = Ntr * Lt, lignes = Ntr * (n + 1);
    const spans = n === 1 ? [Lnet] : (n === 2 ? [Lc, Lc] : [L1, ...Array(n - 2).fill(Lc), L1]);
    return { kind: 'cont', Ntr, Lt, Lnet, n, Lc, L1, thr, thOk, Dd, ntot, np, nd, Ltot, lignes, spans, d: p.d };
  }
  function profIndep(L, D, p) {
    const N = Math.max(1, roundup(L / p.Pmax));
    const Lt = (L - 2 * D.jr - (N - 1) * D.ji) / N;
    const Lc = Lt - 2 * p.d;
    return { kind: 'indep', Ntr: N, Lt, Lnet: Lc, n: 1, Lc, L1: Lc, Dd: Lc, ntot: N, np: N - 1, nd: N - 1, Ltot: N * Lt, lignes: 2 * N, spans: [Lc], d: p.d };
  }
  function rowsCont(pr, isIndep) {
    if (isIndep) return [
      ['Nombre de travées', pr.ntot, 'u', 'N ≥ L / portée maxi'],
      ['Nombre de tabliers indépendants', pr.Ntr, 'u', ''],
      ['Longueur d\'une travée (poutre) Lt', pr.Lt, 'm', '(L − joints) / N'],
      ['Longueur de calcul Lc', pr.Lc, 'm', 'Lc = Lt − 2 × about'],
      ['Portée déterminante', pr.Dd, 'm', ''],
      ['Nombre de piles', pr.np, 'u', ''],
      ['dont piles à double ligne d\'appui', pr.nd, 'u', ''],
      ['Longueur totale de tablier', pr.Ltot, 'm', ''],
      ['Lignes d\'appareils d\'appui', pr.lignes, 'u', '2 par travée'],
    ];
    return [
      ['Nombre de travures (joints de dilatation)', pr.Ntr, 'u', 'N ≥ L / longueur maxi d\'une travure'],
      ['Longueur d\'une travure Lt', pr.Lt, 'm', '(L − joints) / Ntr'],
      ['Longueur entre appareils d\'appui extrêmes', pr.Lnet, 'm', 'Lt − 2 × about d'],
      ['Nombre de travées par travure n', pr.n, 'u', 'Plus petit n tel que la portée ≤ portée maxi'],
      ['Portée des travées centrales Lc', pr.Lc, 'm', 'Lc = Lnet / (2θ + n − 2), arrondie à 5 cm'],
      ['Portée des travées de rive L1', pr.L1, 'm', 'L1 = (Lnet − (n − 2)·Lc) / 2'],
      ['Rapport θ réel = L1 / Lc', pr.thr, '', 'SETRA : 0,5 (0,6 si biais) ≤ θ ≤ 0,85–0,90'],
      ['Contrôle du rapport θ', pr.thOk, '', ''],
      ['Portée déterminante', pr.Dd, 'm', ''],
      ['Nombre total de travées', pr.ntot, 'u', ''],
      ['Nombre de piles', pr.np, 'u', ''],
      ['dont piles doubles (joints entre travures)', pr.nd, 'u', ''],
      ['Longueur totale de tablier', pr.Ltot, 'm', ''],
      ['Lignes d\'appareils d\'appui', pr.lignes, 'u', ''],
    ];
  }

  /* ---------- appuis et fondations (blocs communs) ---------- */
  function supports(c, D, opt = {}) {
    const { B, Htab, d, np, nd } = c;
    const hmgg = Htab + 0.1, emgg = D.mgg, lchevC = 2 * (emgg + d + D.jr), hchevC = D.hchevC;
    const ncol = Math.max(2, xround(B / 3.5)), dcol = D.dcol, Acol = PI * dcol * dcol / 4;
    const Vcul = 2 * (B * (hmgg * emgg + lchevC * hchevC + D.hcorb * D.lcorb) + (D.Hc - hchevC) * Acol * ncol);
    const rows = [
      ['Hauteur du mur garde-grève', hmgg, 'm', 'Hauteur du tablier + 0,10 m'],
      ['Épaisseur du mur garde-grève', emgg, 'm', ''],
      ['Largeur du chevêtre de culée', lchevC, 'm', '2 × (MGG + about + joint)'],
      ['Hauteur du chevêtre de culée', hchevC, 'm', ''],
      ['Nombre de colonnes par appui', ncol, 'u', '≈ une colonne tous les 3,5 m'],
      ['Diamètre des colonnes', dcol, 'm', ''],
      ['Volume des 2 culées', Vcul, 'm³', 'MGG + chevêtre + corbeau + colonnes'],
    ];
    let Vpil, lchevP = B - 1, lps = 1.4, lpd = 2 * (2 * d + D.ji), hchevP = D.hchevP, piers;
    if (opt.massive) {
      const lf = 2.5, bf = opt.bf;
      Vpil = np * lf * bf * D.Hp;
      rows.push(['Longueur des fûts de pile (sens longitudinal)', lf, 'm', 'Piles massives (encastrement provisoire des fléaux)'],
        ['Largeur des fûts de pile', bf, 'm', 'Égale à la largeur inférieure du caisson'],
        ['Volume des piles', Vpil, 'm³', ''], ['Longueur de semelle de pile', bf + 3, 'm', '']);
      piers = { massive: true, lf, bf };
    } else {
      Vpil = lchevP * hchevP * ((np - nd) * lps + nd * lpd) + np * ncol * Acol * (D.Hp - hchevP);
      rows.push(['Longueur du chevêtre de pile', lchevP, 'm', 'B − 1,00 m'],
        ['Largeur chevêtre – pile simple', lps, 'm', ''],
        ['Largeur chevêtre – pile double / travées indépendantes', lpd, 'm', '2 × (2 × about + joint)'],
        ['Hauteur du chevêtre de pile', hchevP, 'm', ''],
        ['Volume des piles', Vpil, 'm³', 'Chevêtres + colonnes']);
      piers = { massive: false, lps, lpd };
    }
    const Vapp = Vcul + Vpil;
    rows.push(['Volume total des appuis', Vapp, 'm³', '']);
    const nsem = 2 + np, hsem = D.hsem;
    let npx, Vsem;
    if (opt.massive) {
      npx = 2 * ncol + np * 8;
      Vsem = hsem * (2 * (B + 1) * (dcol + 1) + np * (opt.bf + 3) * (2.5 + 4));
    } else {
      npx = ncol * nsem;
      Vsem = hsem * (dcol + 1) * (2 * (B + 1) + np * (lchevP + 1));
    }
    const Vpx = npx * D.Lpieu * PI * D.dpieu * D.dpieu / 4, Vfond = Vsem + Vpx;
    const frows = [
      ['Nombre de semelles', nsem, 'u', ''], ['Hauteur des semelles', hsem, 'm', ''],
    ];
    if (opt.massive) frows.push(['Pieux par pile', 8, 'u', ''], ['Nombre de pieux', npx, 'u', '2 × colonnes de culée + 8 par pile']);
    else frows.push(['Nombre de pieux', npx, 'u', 'Un pieu par colonne']);
    frows.push(['Volume des semelles', Vsem, 'm³', 'Largeur = Φ + 1 m'], ['Volume des pieux', Vpx, 'm³', ''], ['Volume total des fondations', Vfond, 'm³', '']);
    const AsApp = Vcul * D.rCul + Vpil * D.rPil, AsFond = Vsem * D.rSem + Vpx * D.rPx;
    return { Vcul, Vpil, Vapp, Vsem, Vpx, Vfond, npx, ncol, hmgg, lchevC, lchevP, hchevC, hchevP, piers, AsApp, AsFond, rowsApp: rows, rowsFond: frows };
  }

  /* ---------- équipements, estimation ---------- */
  function finish(c, D, dv) {
    const div = D.divers / 100, tva = D.tva / 100;
    const q = Object.assign({
      mlJR: 2 * c.B, mlJI: (c.Ntr - 1) * c.B, mlRet: 2 * c.Ltot, Vtrot: dv.Wtrot * D.eTrot * c.Ltot,
      Vcorn: 2 * c.Ltot * D.corn, Vdt: 2 * dv.B * D.LDT * D.eDT,
    }, c.eqOverride || {});
    const As = c.AsTab + c.AsApp + c.AsFond;
    const cBeton = (c.Vtab + c.Vapp) * D.pBA + c.Vfond * D.pFond;
    const cAcier = As * D.pHA, cPrec = c.Ap * D.pBP;
    const cMeth = c.coff * D.pCoff + c.cintre * D.pCintre + c.prefa * D.pPrefa + c.enc * D.pEnc;
    const GO = cBeton + cAcier + cPrec + cMeth;
    const EQ = c.napp * c.puApp + q.mlJR * D.pJR + q.mlJI * D.pJI + q.mlRet * D.pRet + q.Vtrot * D.pTrot + q.Vcorn * D.pCorn + q.Vdt * D.pDT;
    const HT = (GO + EQ) * (1 + div), TTC = HT * (1 + tva);
    const surf = c.surfL * c.surfB;
    Object.assign(c, q, { As, cBeton, cAcier, cPrec, cMeth, GO, EQ, HT, TTC, surf, ratio: surf ? HT / surf : 0, Vtot: c.Vtab + c.Vapp + c.Vfond });
    c.sections.push({ t: 'Quantités d\'aciers', rows: [
      ['Aciers passifs du tablier', c.AsTab, 'kg', 'Σ volumes × ratios'],
      ['Aciers passifs des appuis', c.AsApp, 'kg', 'Culées et piles × ratios (Données)'],
      ['Aciers passifs des fondations', c.AsFond, 'kg', 'Semelles et pieux × ratios'],
      ['Total aciers passifs', As, 'kg', ''],
      ['Aciers de précontrainte', c.Ap, 'kg', c.Ap ? 'Volume du tablier × ratio' : 'Sans objet (béton armé)'],
    ] });
    c.sections.push({ t: 'Coffrages, méthodes et équipements', rows: [
      ['Surface de coffrage du tablier', c.coff, 'm²', ''],
      ['Surface de tablier sur cintre / étaiement', c.cintre, 'm²', 'Ouvrages coulés en place'],
      ['Volume de poutres préfabriquées', c.prefa, 'm³', 'Ouvrages préfabriqués'],
      ['Longueur construite par encorbellement', c.enc, 'ml', ''],
      ['Appareils d\'appui', c.napp, 'u', 'lignes × appareils par ligne'],
      ['Prix unitaire de l\'appareil retenu', c.puApp, 'DT/u', ''],
      ['Joints de chaussée de rive', q.mlJR, 'ml', c.eqOverride ? 'Sans objet (ouvrage enterré)' : '2 × B'],
      ['Joints de chaussée intermédiaires', q.mlJI, 'ml', '(Ntr − 1) × B'],
      ['Dispositifs de retenue', q.mlRet, 'ml', '2 files'],
      ['Béton maigre des trottoirs', q.Vtrot, 'm³', ''],
      ['Corniches et contre-corniches', q.Vcorn, 'm³', ''],
      ['Dalles de transition', q.Vdt, 'm³', '2 dalles'],
    ] });
    c.sections.push({ t: 'Estimation sommaire (DT HT)', rows: [
      ['Béton (tablier + appuis + fondations)', cBeton, 'DT', ''],
      ['Aciers passifs', cAcier, 'DT', ''], ['Précontrainte', cPrec, 'DT', ''],
      ['Coffrages, cintres, préfabrication, encorbellement', cMeth, 'DT', ''],
      ['Total gros œuvre', GO, 'DT', ''], ['Total équipements', EQ, 'DT', ''],
      ['Montant total HT (avec divers et imprévus)', HT, 'DT', `+ ${D.divers} % divers et imprévus`],
      ['Montant total TTC', TTC, 'DT', `TVA ${D.tva} %`],
      ['Surface de l\'ouvrage', surf, 'm²', ''], ['Coût HT par m²', c.ratio, 'DT/m²', ''],
    ] });
    c.sections.push({ t: 'Synthèse', rows: [['Mode de construction', c.mode, '', ''], ['Domaine d\'emploi (SETRA)', c.dom, '', '']] });
    return c;
  }

  function baseRows(T, dv, D, extra = []) {
    return { t: 'Données reprises', rows: [
      ['Obstacle franchi', D.nature, '', ''], ['Catégorie de l\'obstacle', dv.cat, '', ''],
      ['Longueur à franchir L', dv.L, 'm', 'emprise + 2 × marge'], ['Largeur du tablier B', dv.B, 'm', 'roulable + trottoirs + retenue + surlargeurs'],
      ['Hauteur des culées', D.Hc, 'm', ''], ['Hauteur des piles', D.Hp, 'm', ''], ...extra] };
  }

  /* ================= types ================= */
  const calc = {};

  calc.psiba = (D, dv, p) => {
    const B = dv.B, pr = profCont(dv.L, D, p);
    const hp = ceilS(pr.Dd * (1 / 17 + 1 / 12) / 2, 0.05), bp = ceilS(hp * (1 / 7 + 1 / 3) / 2, 0.05);
    const nmin = Math.max(1, roundup(B / 3 - 1)), nmax = Math.max(nmin, int(B / 1.8 - 1));
    const nesp = p.crit === 'Économique' ? nmin : (p.crit === 'Sécuritaire' ? nmax : xround((nmin + nmax) / 2));
    const npo = nesp + 1, b0 = B / npo, Le = b0 / 2, he = ceilS(0.7 * hp, 0.05), amax = 5 * hp;
    const er = Math.max(0, roundup(pr.L1 / amax) - 1), ec = Math.max(0, roundup(pr.Lc / amax) - 1);
    const files = pr.Ntr * ((pr.n + 1) + (pr.n === 1 ? er : (pr.n === 2 ? 2 * ec : 2 * er + (pr.n - 2) * ec)));
    const Htab = hp;
    const sp = supports({ B, Htab, d: p.d, np: pr.np, nd: pr.nd }, D);
    const Vp = npo * bp * (hp - p.hd) * pr.Ltot, Ve = files * (npo - 1) * (b0 - bp) * p.be * (he - p.hd), Vh = p.hd * B * pr.Ltot;
    const Vtab = Vp + Ve + Vh;
    const c = {
      id: 'psiba', mode: 'Coulé en place', B, L: dv.L, Ltot: pr.Ltot, Ntr: pr.Ntr, pr, sp, Htab, Dd: pr.Dd, ntrav: pr.ntot, npout: npo,
      Vtab, Vapp: sp.Vapp, Vfond: sp.Vfond, npx: sp.npx, AsTab: Vp * p.rP + Ve * p.rE + Vh * p.rH, AsApp: sp.AsApp, AsFond: sp.AsFond, Ap: 0,
      coff: ((B - npo * bp) + 2 * npo * (hp - p.hd) + npo * bp + 2 * p.hd) * pr.Ltot + 2 * files * (npo - 1) * (b0 - bp) * (he - p.hd),
      cintre: B * pr.Ltot, prefa: 0, enc: 0, napp: pr.lignes * npo, puApp: D.pAppBA, surfL: dv.L, surfB: B,
      dom: pr.Dd >= 10 && pr.Dd <= 20 ? 'OK' : 'Hors domaine (10–20 m)',
      G: { hp, bp, npo, b0, Le, he, hd: p.hd, be: p.be, er, ec, amax },
    };
    c.sections = [baseRows('psiba', dv, D), { t: 'Profil longitudinal (travures continues)', rows: rowsCont(pr) },
      { t: 'Profil en travers – poutres, entretoises, hourdis', rows: [
        ['hp mini = Lcalc / 17', pr.Dd / 17, 'm', 'Élancement 1/17 à 1/12'], ['hp maxi = Lcalc / 12', pr.Dd / 12, 'm', ''],
        ['Hauteur des poutres hp (hourdis compris)', hp, 'm', 'Moyenne de la plage, arrondie à 5 cm'],
        ['Épaisseur des poutres bp', bp, 'm', 'bp = (1/7 à 1/3)·hp'],
        ['Nombre d\'espacements mini (b0 ≤ 3,00 m)', nmin, 'u', 'b0 (n + 1) = B avec Le = b0/2'],
        ['Nombre d\'espacements maxi (b0 ≥ 1,80 m)', nmax, 'u', ''], ['Nombre d\'espacements retenu', nesp, 'u', 'Critère : ' + p.crit],
        ['Nombre de poutres', npo, 'u', ''], ['Entraxe des poutres b0', b0, 'm', '1,80 à 3,00 m'], ['Encorbellement Le', Le, 'm', 'Le = b0/2 (≤ 1,50 m)'],
        ['Hauteur des entretoises he', he, 'm', 'he = (0,60 à 0,80)·hp'], ['Espacement maxi des entretoises', amax, 'm', 'a = (3 à 5)·hp'],
        ['Entretoises intermédiaires / travée de rive', er, 'u', ''], ['Entretoises intermédiaires / travée centrale', ec, 'u', ''],
        ['Nombre total de files d\'entretoises', files, 'u', 'Appuis + intermédiaires'], ['Hauteur structurelle du tablier', Htab, 'm', '']] },
      { t: 'Appuis : culées et piles', rows: sp.rowsApp }, { t: 'Fondations (semelles sur pieux)', rows: sp.rowsFond },
      { t: 'Volumes de béton', rows: [['Poutres', Vp, 'm³', ''], ['Entretoises', Ve, 'm³', ''], ['Hourdis', Vh, 'm³', ''],
        ['Sous-total tablier', Vtab, 'm³', ''], ['Sous-total appuis', sp.Vapp, 'm³', ''], ['Sous-total fondations', sp.Vfond, 'm³', ''],
        ['Volume total de béton', Vtab + sp.Vapp + sp.Vfond, 'm³', '']] }];
    return finish(c, D, dv);
  };

  calc.psida = (D, dv, p) => {
    const B = dv.B, pr = profCont(dv.L, D, p);
    const el = pr.n === 1 ? 1 / 20 : (pr.n === 2 ? 1 / 26 : 1 / 28);

        for (let x = ob1 + 1; x < ob2 - 1; x += 4.5) if (!isle || x + 2.2 < isle[0] || x > isle[1]) c.rect(x, yF - 0.03, x + 2.2, yF + 0.02, K.mark);
      }
      // gabarit
      const gTop = yF + D.Hlibre, okG = (-H) - yF >= D.Hlibre - 1e-6;
      c.rect(ob1 + 0.3, yF, ob2 - 0.3, gTop, 'none', okG ? K.ok : K.ko, 1, 'stroke-dasharray="6 4"');
      c.text((ob1 + ob2) / 2, gTop, `Gabarit H = ${f1(D.Hlibre)} m ${okG ? '– respecté' : '– insuffisant'}`, { size: 10.5, color: okG ? K.ok : K.ko, dy: 13, halo: true });
      c.text(ob1 + 1.5, yF, D.nature, { size: 11, weight: 700, dy: -6, anchor: 'start', color: K.ink, halo: true });
    } else {
      const yW = yF + D.phe;
      c.poly([[ob1, yF], [ob2, yF], [ob2, yW], [ob1, yW]], `url(#${id}-water)`, K.waterS, 0.8);
      c.line(ob1 - 1, yW, ob2 + 1, yW, K.waterS, 1.2, 'stroke-dasharray="8 3"');
      const okR = (-H) - yW >= D.revanche - 1e-6;
      c.text(ob1 + 2, yW, `PHE  (revanche ${f1((-H) - yW)} m ${okR ? '≥' : '<'} ${f1(D.revanche)} m)`, { size: 10, anchor: 'start', dy: -5, color: okR ? K.waterS : K.ko, halo: true });
      c.text((ob1 + ob2) / 2, yF, D.nature, { size: 11, weight: 600, dy: -6, color: '#0F3D63', halo: true });
    }
    // fondations et appuis : culées
    const Ac = (x0, side) => {
      const cx = x0;
      // dalle de transition
      const xb = side < 0 ? -D.mgg : L + D.mgg;
      c.poly([[xb, -0.28], [xb + side * D.LDT, -0.28 - D.LDT * 0.05], [xb + side * D.LDT, -0.28 - D.LDT * 0.05 - D.eDT], [xb, -0.28 - D.eDT]], K.insitu, K.insituS, 0.8);
      // corbeau + mur garde-grève
      c.rect(xb, 0.05, side < 0 ? 0 : L, hb + D.hchevC, K.insitu, K.insituS, 1);
      c.rect(xb, -0.28, xb + side * D.lcorb, -0.28 - D.hcorb, K.insitu, K.insituS, 0.8);
      // chevêtre
      const x1 = side < 0 ? -D.mgg : L + D.mgg, x2 = side < 0 ? -D.mgg + sp.lchevC : L + D.mgg - sp.lchevC;
      c.rect(x1, -H - 0.06, x2, hb, K.insitu, K.insituS, 1);
      // colonne(s)
      c.rect(cx - D.dcol / 2, hb, cx + D.dcol / 2, yTN, K.insitu, K.insituS, 1);
      // semelle + pieux
      const sw = (D.dcol + 1) / 2;
      c.rect(cx - sw, yTN, cx + sw, yTN - D.hsem, K.found, K.foundS, 1);
      c.rect(cx - D.dpieu / 2, yTN - D.hsem, cx + D.dpieu / 2, yTN - D.hsem - D.Lpieu, K.pile, K.foundS, 0.8);
      c.line(cx - D.dpieu / 2 - 0.3, yTN - D.hsem - D.Lpieu, cx + D.dpieu / 2 + 0.3, yTN - D.hsem - D.Lpieu, K.foundS, 1);
    };
    Ac(jr + d, -1); Ac(L - jr - d, 1);
    // piles
    piers.forEach((p, i) => {
      const dep = depth(p.x), top = -dep - 0.06;
      if (sp.piers.massive) {
        c.rect(p.x - p.w / 2, top, p.x + p.w / 2, yF, K.insitu, K.insituS, 1);
        const sw = 3.25;
        c.rect(p.x - sw, yF, p.x + sw, yF - D.hsem, K.found, K.foundS, 1);
        for (const dx of [-sw + 0.8, -0.9, 0.9, sw - 0.8]) c.rect(p.x + dx - D.dpieu / 2, yF - D.hsem, p.x + dx + D.dpieu / 2, yF - D.hsem - D.Lpieu, K.pile, K.foundS, 0.6);
      } else {
        c.rect(p.x - p.w / 2, top, p.x + p.w / 2, top - D.hchevP, K.insitu, K.insituS, 1);
        c.rect(p.x - D.dcol / 2, top - D.hchevP, p.x + D.dcol / 2, yF, K.insitu, K.insituS, 1);
        const sw = (D.dcol + 1) / 2;
        c.rect(p.x - sw, yF, p.x + sw, yF - D.hsem, K.found, K.foundS, 1);
        c.rect(p.x - D.dpieu / 2, yF - D.hsem, p.x + D.dpieu / 2, yF - D.hsem - D.Lpieu, K.pile, K.foundS, 0.8);
      }
      c.line(p.x - 1.1, yF - D.hsem - D.Lpieu, p.x + 1.1, yF - D.hsem - D.Lpieu, K.foundS, 1);
      c.text(p.x, yF - D.hsem - D.Lpieu, `P${i + 1}`, { size: 10.5, weight: 600, dy: 14 });
    });
    c.text(jr + d, yTN - D.hsem - D.Lpieu, 'C0', { size: 10.5, weight: 600, dy: 14 });
    c.text(L - jr - d, yTN - D.hsem - D.Lpieu, `C${piers.length + 1}`, { size: 10.5, weight: 600, dy: 14 });
    // tablier
    const [dfc, dsc] = deckColor(r.id);
    travures.forEach(t => {
      const N = Math.max(24, Math.round((t.xe - t.xs) * 3));
      const bot = [];
      for (let i = N; i >= 0; i--) { const x = t.xs + (t.xe - t.xs) * i / N; bot.push([x, -depth(x)]); }
      c.poly([[t.xs, 0], [t.xe, 0], ...bot], dfc, dsc, 1.1);
      if (['psiba', 'tiba', 'vipp'].includes(r.id)) {
        const hd = G.hd || 0.2;
        c.line(t.xs, -hd, t.xe, -hd, dsc, 0.6, 'stroke-dasharray="5 3" opacity="0.8"');
        t.axes.forEach(x => c.rect(x - 0.12, -hd, x + 0.12, -(G.he || G.hpo || H) * 0.95, '#B1BCC6', dsc, 0.6));
      }
      // revêtement + dispositif de retenue
      c.rect(t.xs, 0, t.xe, 0.1, K.road, 'none');
      c.line(t.xs, 0.95, t.xe, 0.95, K.barrier, 1.6);
      for (let x = t.xs + 0.3; x < t.xe; x += 2) c.line(x, 0.1, x, 0.95, K.barrier, 0.8);
      // appareils d'appui
      t.axes.forEach(x => c.rect(x - 0.25, -depth(x), x + 0.25, -depth(x) - 0.08, K.bear));
      // câbles de précontrainte
      if (r.cable) {
        const pts = t.axes, dd = [];
        let dpath = '';
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1], ea = (i === 0 && pr.kind === 'cont') || pr.kind === 'indep', eb = (i === pts.length - 2) || pr.kind === 'indep';
          const ya = ea ? -depth(a) * 0.5 : -depth(a) * 0.15, yb = eb ? -depth(b) * 0.5 : -depth(b) * 0.15;
          const ym = -depth((a + b) / 2) * 0.9;
          const cy = 2 * ym - (ya + yb) / 2;
          if (i === 0) dpath += `M${c.X(a).toFixed(1)} ${c.Y(ya).toFixed(1)} `;
          dpath += `Q${c.X((a + b) / 2).toFixed(1)} ${c.Y(cy).toFixed(1)} ${c.X(b).toFixed(1)} ${c.Y(yb).toFixed(1)} `;
        }
        c.path(dpath, 'none', K.cable, 1.6, 'stroke-dasharray="7 3"');
      }
      // voussoirs
      if (r.id === 'caisson') {
        piers.filter(p => p.x > t.xs && p.x < t.xe).forEach(p => {
          for (const sgn of [-1, 1]) {
            let x = p.x + sgn * G.lvsp / 2;
            c.line(x, 0, x, -depth(x), dsc, 0.8);
            for (let k = 0; k < G.nv; k++) { x += sgn * G.lv; if (Math.abs(x - p.x) > pr.Lc / 2 - 0.9) break; c.line(x, 0, x, -depth(x), dsc, 0.5, 'opacity="0.6"'); }
          }
        });
      }
    });
    // cotes
    const yd1 = c.Y(yTop) + 8, yd2 = yd1 + 26;
    c.dimH(0, L, yd1 - 4, `Longueur à franchir L = ${f1(L)} m`, { ext: c.Y(0) - 2 });
    travures.forEach(t => {
      for (let i = 0; i < t.axes.length - 1; i++) c.dimH(t.axes[i], t.axes[i + 1], yd2, f1(t.axes[i + 1] - t.axes[i]), { ext: c.Y(0.1) });
    });
    const xd = c.X(xmin) + 18;
    c.dimV(c.X(-D.mgg) - 30, 0, -H, `${f1(H)}`, { side: 'left' });
    if (piers[0]) {
      const p0 = piers[0];
      c.dimV(c.X(p0.x) + 22, -depth(p0.x), yF, `Hp = ${f1(D.Hp)} m`, { side: 'right' });
    }
    c.dimV(xd, -H, yTN, `Hc = ${f1(D.Hc)}`, { side: 'right' });
    c.text(L / 2, yBot, `Pieux Φ ${f1(D.dpieu)} m – L = ${f1(D.Lpieu, 1)} m`, { size: 9.5, color: K.soft, dy: -6 });
    // légende + échelle
    scaleBar(c, 20, Hpx - 28, 200);
    legend(c, 260, Hpx - 34, [
      [dfc, dsc, r.id === 'tiba' || r.id === 'vipp' ? 'Tablier préfabriqué' : (r.cable ? 'Béton précontraint' : 'Béton armé')],
      [K.insitu, K.insituS, 'Appuis'], [K.found, K.foundS, 'Fondations'], [K.fill, K.soilS, 'Remblai'],
      ...(r.cable ? [[null, K.cable, 'Câble de précontrainte', '7 3']] : []),
    ]);
    const sub = `${r.code} – ${pr.ntot} travée${pr.ntot > 1 ? 's' : ''} – ${ve === 1 ? 'à l\'échelle' : 'échelle verticale ×' + ve}`;
    return frame(id, W, Hpx, 'COUPE LONGITUDINALE', sub, c.out.join(''));
  }

  /* -------- cadres : coupe dans le sens de la voie portée -------- */
  function cadreCells(r, D, dv, opt = {}) {
    const ve = opt.ve || 1, id = 'L' + (++uid), G = r.G;
    const W = 1180, ext = Math.max(4, G.Hext * 0.9 + 2);
    const xmin = -ext, xmax = G.Wext + ext;
    const yTop = G.Hext + G.Hr + 2.2, yBot = -(G.fond === 'Radier' ? 0 : 1) - (G.fond === 'Pieux' ? D.Lpieu : 0) - 1.5;
    const s = (W - 92) / (xmax - xmin), topPx = 88;
    const Hpx = Math.round(topPx + (yTop - yBot) * s * ve + 70);
    const c = Canvas(s, 46 - xmin * s, topPx + yTop * s * ve, ve);
    const y0 = 0, yRadTop = G.fond === 'Radier' ? G.et : 0, yIn = yRadTop, yTr = yIn + G.Hnus, yTop2 = yTr + G.et, yRoad = yTop2 + G.Hr;
    c.poly([[xmin, yRoad - 0.05], [xmax, yRoad - 0.05], [xmax, yBot], [xmin, yBot]], `url(#${id}-soil)`, K.soilS, 0.8);
    c.poly([[-1.2, yRoad], [G.Wext + 1.2, yRoad], [G.Wext + 1.2 + G.Hext, -0.1], [-1.2 - G.Hext, -0.1]], `url(#${id}-fill)`, K.soilS, 0.7);
    c.rect(xmin, yRoad, xmax, yRoad + 0.1, K.road);
    // structure
    const col = [K.insitu, K.insituS];
    if (G.fond === 'Radier') c.rect(-0.25, 0, G.Wext + 0.25, G.et, ...col, 1.1);
    c.rect(0, yTr, G.Wext, yTop2, ...col, 1.1);
    for (let i = 0; i <= G.ncell; i++) {
      const x = i * (G.lcell + G.ep);
      c.rect(x, yIn, x + G.ep, yTr, ...col, 1.1);
      if (G.fond !== 'Radier') {
        c.rect(x + G.ep / 2 - G.bsem / 2, yIn - 1, x + G.ep / 2 + G.bsem / 2, yIn, K.found, K.foundS, 1);
        if (G.fond === 'Pieux') c.rect(x + G.ep / 2 - D.dpieu / 2, yIn - 1, x + G.ep / 2 + D.dpieu / 2, yIn - 1 - D.Lpieu, K.pile, K.foundS, 0.8);
      }
    }
    for (let i = 0; i < G.ncell; i++) {
      const a = i * (G.lcell + G.ep) + G.ep, b = a + G.lcell;
      c.poly([[a, yTr], [a + 0.3, yTr], [a, yTr - 0.3]], ...col, 0.6);
      c.poly([[b, yTr], [b - 0.3, yTr], [b, yTr - 0.3]], ...col, 0.6);
      if (G.fond === 'Radier') { c.poly([[a, yIn], [a + 0.3, yIn], [a, yIn + 0.3]], ...col, 0.6); c.poly([[b, yIn], [b - 0.3, yIn], [b, yIn + 0.3]], ...col, 0.6); }
      if (G.sur) {
        if (dv.cat === 'Naturel') c.rect(a, yIn, b, yIn + Math.min(D.phe, G.Hnus * 0.6), `url(#${id}-water)`, K.waterS, 0.6);
        else { c.rect(a + 0.2, yIn, b - 0.2, yIn + 0.25, K.road); c.rect((a + b) / 2 - 0.9, yIn + 0.22, (a + b) / 2 + 0.9, yIn + 0.27, K.mark); }
      } else { c.rect(a + 0.2, yIn, b - 0.2, yIn + 0.25, K.road); }
      c.dimH(a, b, c.Y(yIn) + 22, f1(G.lcell), {});
    }
    c.dimH(0, G.Wext, c.Y(yRoad) - 30, `Largeur extérieure ${f1(G.Wext)} m – ouverture O = ${f1(G.O)} m`, { ext: c.Y(yTop2) - 2 });
    c.dimV(c.X(G.Wext) + 26, yIn, yTr, `${f1(G.Hnus)} (entre nus)`, { side: 'right' });
    c.dimV(c.X(G.Wext) + 26, yTr, yTop2, `et ${f1(G.et)}`, { side: 'right' });
    c.dimV(c.X(0) - 26, yTop2, yRoad, `Remblai ${f1(G.Hr)}`, { side: 'left' });
    c.dimV(c.X(0) - 26, yIn - (G.fond === 'Radier' ? G.et : 0), yTop2, `${f1(G.Hext)}`, { side: 'left' });
    c.text(G.ep / 2, yIn, `ep ${f1(G.ep)}`, { size: 9.5, dy: 36, color: K.dim });
    scaleBar(c, 20, Hpx - 28, 200);
    legend(c, 260, Hpx - 34, [[K.insitu, K.insituS, 'Cadre en béton armé'], [K.found, K.foundS, 'Fondations'], [K.fill, K.soilS, 'Remblai']]);
    return frame(id, W, Hpx, 'COUPE TRANSVERSALE (SECTION DES CELLULES)', `${G.typ} – ${G.ncell} cellule${G.ncell > 1 ? 's' : ''} – fondation : ${G.fond.toLowerCase()}`, c.out.join(''));
  }

  /* ---------------- coupe transversale ---------------- */
  function equip(c, D, dv, B, y0, id) {
    const ret = D.ret / 2;
    const tl = (D.trot === '2 côtés' || D.trot === 'A gauche') ? D.ltrot : 0;
    const trr = (D.trot === '2 côtés' || D.trot === 'A droite') ? D.ltrot : 0;
    const xl = -B / 2, xr = B / 2;
    const r1 = xl + ret + tl, r2 = xr - ret - trr;
    c.rect(r1, y0, r2, y0 + 0.1, K.road, '#2C3035', 0.6);
    // marquage
    const xs0 = r1 + D.surl / 2;
    for (let i = 0; i <= D.nv; i++) { const x = xs0 + i * D.lv; c.rect(x - 0.06, y0 + 0.1, x + 0.06, y0 + 0.115, K.mark); }
    if (tl) { c.rect(xl + ret, y0, r1, y0 + D.eTrot + 0.05, K.trot, '#8F877A', 0.6); c.rect(r1 - 0.15, y0, r1, y0 + D.eTrot + 0.1, '#BDB6AA', '#8F877A', 0.6); }
    if (trr) { c.rect(r2, y0, xr - ret, y0 + D.eTrot + 0.05, K.trot, '#8F877A', 0.6); c.rect(r2, y0, r2 + 0.15, y0 + D.eTrot + 0.1, '#BDB6AA', '#8F877A', 0.6); }
    for (const [x, sg] of [[xl, 1], [xr, -1]]) {
      c.rect(x, y0 - 0.35, x + sg * 0.22, y0 + 0.28, K.insitu, K.insituS, 0.6);
      const px = x + sg * Math.max(0.18, ret * 0.55);
      c.rect(px - 0.05, y0 + 0.05, px + 0.05, y0 + 1.0, K.barrier, '#8A5A12', 0.5);
      c.rect(px - sg * 0.02, y0 + 0.62, px + sg * Math.max(0.12, ret * 0.35), y0 + 0.82, K.barrier, '#8A5A12', 0.5);
    }
    // chaîne de cotes
    const yp = c.Y(y0 + 1.0) - 22;
    const parts = [[xl, xl + ret, 'retenue'], ...(tl ? [[xl + ret, r1, 'trottoir']] : []), [r1, r1 + D.surl / 2, ''],
      ...Array.from({ length: D.nv }, (_, i) => [xs0 + i * D.lv, xs0 + (i + 1) * D.lv, `voie ${f1(D.lv)}`]), [r2 - D.surl / 2, r2, ''],
      ...(trr ? [[r2, xr - ret, 'trottoir']] : []), [xr - ret, xr, 'retenue']];
    parts.forEach(([a, b, lab]) => { if (b - a > 1e-6) c.dimH(a, b, yp, (b - a) >= 1.2 ? `${lab ? lab + ' ' : ''}${lab.startsWith('voie') ? '' : f1(b - a)}`.trim() : f1(b - a), { size: 9.5 }); });
    c.dimH(xl, xr, yp - 22, `Largeur du tablier B = ${f1(B)} m`, { ext: c.Y(y0) });
  }

  function trans(r, D, dv, opt = {}) {
    if (r.id === 'cadres') return cadreCells(r, D, dv, opt);
    const id = 'T' + (++uid), G = r.G, B = r.B;
    const H = r.id === 'caisson' ? G.hp : r.Htab;
    const W = 1180, xmin = -B / 2 - 1.6, xmax = B / 2 + 1.6;
    const s = Math.min((W - 92) / (xmax - xmin), 70);
    const yTop = 1.6, yBot = -H - 0.9;
    const topPx = 30 + 70, Hpx = Math.round(topPx + (yTop - yBot) * s + 76);
    const x0px = W / 2;
    const c = Canvas(s, x0px, topPx + yTop * s, 1);
    const [fc, sc] = deckColor(r.id);
    const xl = -B / 2, xr = B / 2;
    const dimsBottom = [];
    if (r.id === 'psiba' || r.id === 'tiba') {
      // entretoise en arrière-plan
      if (r.id === 'psiba') c.rect(xl + G.Le, -G.hd, xr - G.Le, -G.he, '#E3E8EC', '#9AA6B1', 0.6, 'stroke-dasharray="4 3"');
      else c.rect(xl + G.Le, -G.hd, xr - G.Le, -G.he, '#E3E8EC', '#9AA6B1', 0.6, 'stroke-dasharray="4 3"');
      const bc = r.id === 'tiba' ? [K.precast, K.precastS] : [K.insitu, K.insituS];
      for (let i = 0; i < G.npo; i++) {
        const x = xl + G.Le + i * G.b0;
        c.rect(x - G.bp / 2, -G.hd, x + G.bp / 2, -G.hp, ...bc, 1);
      }
      c.rect(xl, 0, xr, -G.hd, K.insitu, K.insituS, 1);
      if (r.id === 'tiba') for (let i = 0; i < G.npo - 1; i++) { const a = xl + G.Le + i * G.b0 + G.bp / 2, b = a + G.b0 - G.bp; c.rect(a, -G.hd, b, -G.hd + G.ep, K.precast, K.precastS, 0.6); }
      for (let i = 0; i < G.npo; i++) c.line(xl + G.Le + i * G.b0, 0.4, xl + G.Le + i * G.b0, -G.hp - 0.3, K.soft, 0.5, 'stroke-dasharray="10 3 2 3"');
      const yb = c.Y(-G.hp) + 24;
      c.dimH(xl, xl + G.Le, yb, `Le ${f1(G.Le)}`);
      for (let i = 0; i < G.npo - 1; i++) c.dimH(xl + G.Le + i * G.b0, xl + G.Le + (i + 1) * G.b0, yb, `b0 ${f1(G.b0)}`);
      c.dimH(xr - G.Le, xr, yb, `${f1(G.Le)}`);
      c.dimV(c.X(xl) - 20, 0, -G.hp, `hp ${f1(G.hp)}`, { side: 'left' });
      c.dimV(c.X(xr) + 20, 0, -G.hd, `hd ${f1(G.hd)}`, { side: 'right' });
      c.text(xl + G.Le, -G.hp, `bp ${f1(G.bp)}`, { size: 9.5, dy: 38, color: K.dim });
      c.text(0, -G.he, 'Entretoise (en arrière-plan)', { size: 9.5, color: K.soft, dy: -4 });
    } else if (r.id === 'psida') {
      c.poly([[xl, 0], [xr, 0], [xr, -G.hb], [xr - G.ch, -G.hd], [xl + G.ch, -G.hd], [xl, -G.hb]], fc, sc, 1.1);
      c.dimV(c.X(xl) - 20, 0, -G.hd, `hd ${f1(G.hd)}`, { side: 'left' });
      c.dimV(c.X(xr) + 20, 0, -G.hb, `${f1(G.hb)} en rive`, { side: 'right' });
      c.dimH(xl, xl + G.ch, c.Y(-G.hd) + 22, `chanfrein ${f1(G.ch)}`);
      c.text(0, -G.hd / 2, 'Dalle pleine en béton armé', { size: 11, dy: 4, weight: 600, color: K.insituS });
    } else if (r.id === 'psidp') {

  function fieldHTML(f, obj, scope) {
    const id = `f-${scope}-${f.k}`;
    if (f.t === 'calc') return `<div class="fld"><label>${esc(f.l)}</label><div class="calc" data-calc="${f.k}" data-u="${f.u || ''}"></div></div>`;
    let ctl;
    const v = obj[f.k];
    if (f.t === 's') ctl = `<div class="inp"><select id="${id}" data-scope="${scope}" data-k="${f.k}">${f.o.map(o => `<option${String(o) === String(v) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    else if (f.t === 'txt') ctl = `<div class="inp"><input type="text" id="${id}" data-scope="${scope}" data-k="${f.k}" value="${esc(v)}"></div>`;
    else if (f.t === 'date') ctl = `<div class="inp"><input type="date" id="${id}" data-scope="${scope}" data-k="${f.k}" value="${esc(v)}"></div>`;
    else ctl = `<div class="inp"><input inputmode="decimal" id="${id}" data-scope="${scope}" data-k="${f.k}" data-t="${f.t}" value="${v === '' || v == null ? '' : String(v).replace('.', ',')}"${f.t === 'opt' ? ' placeholder="auto"' : ''}>${f.u ? `<span class="u">${esc(f.u)}</span>` : ''}</div>`;
    const wide = f.t === 'txt' || f.t === 's' && f.o.some(o => String(o).length > 14);
    return `<div class="fld${wide ? ' wide' : ''}"><label for="${id}">${esc(f.l)}</label>${ctl}${f.h ? `<div class="hint">${esc(f.h)}</div>` : ''}</div>`;
  }

  function onInput(e) {
    const el = e.target; if (!el.dataset || !el.dataset.k) return;
    const obj = el.dataset.scope === 'D' ? D : P[el.dataset.scope];
    const k = el.dataset.k;
    let v = el.value;
    if (el.tagName === 'INPUT' && (el.dataset.t === 'n' || el.dataset.t === 'opt')) {
      const t = v.replace(/\s/g, '').replace(',', '.');
      if (el.dataset.t === 'opt' && t === '') v = '';
      else { if (t === '' || t === '-' || isNaN(+t)) return; v = +t; }
    } else if (k === 'nv') v = +v;
    obj[k] = v;
    S = OA.computeAll(D, P);
    persist();
    refresh();
  }

  /* ---- estimation ---- */
  function estimateRows(r) {
    const A = [['Béton armé – tablier', 'm³', r.Vtab, D.pBA], ['Béton armé – appuis (culées, piles)', 'm³', r.Vapp, D.pBA], ['Béton – fondations (semelles, pieux, radier)', 'm³', r.Vfond, D.pFond],
      ['Aciers passifs HA', 'kg', r.As, D.pHA], ['Aciers de précontrainte', 'kg', r.Ap, D.pBP], ['Coffrages du tablier', 'm²', r.coff, D.pCoff],
      ['Cintre / étaiement', 'm²', r.cintre, D.pCintre], ['Préfabrication, manutention et pose des poutres', 'm³', r.prefa, D.pPrefa], ['Matériel d\'encorbellement', 'ml', r.enc, D.pEnc]];
    const B = [['Appareils d\'appui', 'u', r.napp, r.puApp], ['Joints de chaussée de rive', 'ml', r.mlJR, D.pJR], ['Joints de chaussée intermédiaires', 'ml', r.mlJI, D.pJI],
      ['Dispositifs de retenue', 'ml', r.mlRet, D.pRet], ['Trottoirs en béton maigre', 'm³', r.Vtrot, D.pTrot], ['Corniches et contre-corniches', 'm³', r.Vcorn, D.pCorn], ['Dalles de transition', 'm³', r.Vdt, D.pDT]];
    const tA = A.reduce((s, x) => s + x[2] * x[3], 0), tB = B.reduce((s, x) => s + x[2] * x[3], 0);
    const T = tA + tB, div = T * D.divers / 100, HT = T + div, tva = HT * D.tva / 100, TTC = HT + tva;
    return { A, B, tA, tB, T, div, HT, tva, TTC };
  }
  function estimateHTML(r) {
    const e = estimateRows(r);

    return `<div class="tbl-wrap"><table class="t">${H}<tbody>
      <tr class="sec"><td colspan="5">A. Gros œuvre et méthodes</td></tr>${tb(e.A)}<tr class="tot"><td colspan="4">Total A – gros œuvre</td><td class="v">${nf(e.tA, 0)}</td></tr>
      <tr class="sec"><td colspan="5">B. Équipements</td></tr>${tb(e.B)}<tr class="tot"><td colspan="4">Total B – équipements</td><td class="v">${nf(e.tB, 0)}</td></tr>

      <tr><td colspan="3">TVA</td><td class="v">${nf(D.tva, 0)} %</td><td class="v">${nf(e.tva, 0)}</td></tr>
      <tr class="tot"><td colspan="4">MONTANT TOTAL TTC</td><td class="v">${nf(e.TTC, 0)}</td></tr>
      <tr><td colspan="4">Ratio : coût HT par m² d'ouvrage (${nf(r.surf, 0)} m²)</td><td class="v">${nf(e.HT / r.surf, 0)}</td></tr>
      <tr><td colspan="4">Ratio : coût HT par mètre linéaire (${nf(r.L, 2)} m)</td><td class="v">${nf(e.HT / r.L, 0)}</td></tr>
    </tbody></table></div>`;
  }
  V.estimation = () => {
    const v = UI.estVar && S.R[UI.estVar] ? UI.estVar : (S.best || 'psiba');
    return `<section class="view">${head('Estimation des prix', 'Choisir une variante : son devis estimatif s\'affiche aussitôt. Quantités issues du prédimensionnement ; prix unitaires des données générales.', 'Onglet 11')}
      <div class="card"><div class="card-b" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
        <div class="fld wide" style="min-width:min(100%,520px)"><label for="estSel"><b>Variante à estimer</b></label><div class="inp"><select id="estSel">${OA.TYPES.map(t => `<option value="${t.id}"${t.id === v ? ' selected' : ''}>${t.short}${t.id === S.best ? ' (recommandée)' : ''}</option>`).join('')}</select></div></div>

  function dynEst() {
    const v = $('#estSel') ? $('#estSel').value : S.best;

    main.querySelector('[data-dyn="estInfo"]').innerHTML = `<span class="pill p-n">${esc(r.mode)}</span>${pillDom(r.dom)}${pillAdeq(r.adeq)}<span class="pill p-n">Surface ${nf(r.surf, 0)} m²</span>`;
    main.querySelector('[data-dyn="estStrip"]').innerHTML = `<div class="strip"><div><small>Gros œuvre</small><b>${money(e.tA)}</b></div><div><small>Équipements</small><b>${money(e.tB)}</b></div><div><small>Montant HT</small><b>${money(e.HT)}</b></div><div><small>Montant TTC</small><b>${money(e.TTC)}</b></div><div><small>HT / m²</small><b>${nf(e.HT / r.surf, 0)} DT</b></div></div>`;
    main.querySelector('[data-dyn="estTable"]').innerHTML = estimateHTML(r);
  }

  /* ---- comparaison multicritère ---- */
  const CRIT = [['adeq', 'Adéquation de l\'obstacle'], ['mode', 'Mode de construction'], ['esth', 'Esthétique'], ['secu', 'Sécurité'], ['dom', 'Domaine d\'emploi'], ['cout', 'Coût']];
  function scoreAll() {
    const ok = OA.TYPES.map(t => S.R[t.id]).filter(r => r.pond != null);
    const minHT = ok.length ? Math.min(...ok.map(r => r.HT)) : 1;
    const out = {};
    for (const t of OA.TYPES) {
      const r = S.R[t.id], s = {}, why = {};
      s.adeq = r.adeq === 'Recommandée' ? 5 : r.adeq === 'Possible' ? 3 : r.adeq.startsWith('Possible') ? 2 : 0; why.adeq = r.adeq;
      s.dom = r.dom === 'OK' ? 5 : r.dom.startsWith('OK') ? 4 : 0; why.dom = r.dom;
      if (r.mode === 'Préfabriqué') { s.mode = 4; why.mode = 'Préfabrication : pas de cintre, délais courts, lancement ou levage des poutres'; }
      else if (r.mode === 'Encorbellements successifs') { s.mode = 2.5; why.mode = 'Équipages mobiles, technicité élevée, pas d\'appui au sol'; }
      else if (S.dv.cat === 'Naturel') { s.mode = 2; why.mode = 'Cintre dans le lit : risque de crue, travaux en site hydraulique'; }
      else { s.mode = 3.5; why.mode = 'Coulé en place sur cintre : maîtrise courante, déviation du trafic'; }
      const sl = r.Dd / Math.max(r.Htab, 0.01);
      let es = r.id === 'cadres' ? 3 : Math.max(1, Math.min(5, 1 + (sl - 10) / 5));
      if (['psida', 'psiba', 'psidp', 'psidn', 'caisson'].includes(r.id)) es += 0.5;
      if (r.id === 'caisson' || (r.id === 'psidn' && r.G.iner === 'Variable')) es += 0.5;
      if (r.pr && r.pr.kind === 'indep' && r.ntrav >= 3) es -= 0.5;
      s.esth = Math.max(1, Math.min(5, es));
      why.esth = r.id === 'cadres' ? 'Ouvrage enterré, discret' : `Élancement L/h ≈ ${nf(sl, 0)}${r.pr && r.pr.kind === 'indep' ? ', travées indépendantes (joints visibles)' : ', tablier continu'}`;
      let se = r.id === 'cadres' ? 4.5 : (r.pr && r.pr.kind === 'indep' ? 3 : 4);
      const notes = [];
      if (r.mode === 'Coulé en place' && S.dv.cat === 'Artificiel' && r.id !== 'cadres') { se -= 0.5; notes.push('cintre au-dessus du trafic'); }
      if (r.id === 'vipp' && r.G.poids > 60) { se -= 0.5; notes.push(`levage de poutres de ${nf(r.G.poids, 0)} t`); }
      const nj = r.mlJI && r.B ? Math.round(r.mlJI / r.B) : 0;
      if (nj) { se -= Math.min(1, 0.25 * nj); notes.push(`${nj} joint${nj > 1 ? 's' : ''} intermédiaire${nj > 1 ? 's' : ''}`); }
      s.secu = Math.max(1, Math.min(5, se));
      why.secu = (r.pr && r.pr.kind === 'indep' ? 'Structure isostatique' : r.id === 'cadres' ? 'Structure enterrée et robuste' : 'Structure hyperstatique (redondance)') + (notes.length ? ' ; ' + notes.join(', ') : '');
      s.cout = r.pond != null ? 5 * minHT / r.HT : 0; why.cout = `${money(r.HT)} HT – ${nf(r.ratio, 0)} DT/m²`;
      const W = UI.weights, sw = Object.values(W).reduce((a, b) => a + (+b || 0), 0) || 1;
      const tot = CRIT.reduce((a, [k]) => a + s[k] * (+W[k] || 0), 0) / sw / 5 * 100;
      out[t.id] = { s, why, tot: r.pond != null ? tot : null };
    }
    const ranked = Object.entries(out).filter(([, v]) => v.tot != null).sort((a, b) => b[1].tot - a[1].tot);
    ranked.forEach(([k, v], i) => v.rank = i + 1);
    return { out, best: ranked[0] ? ranked[0][0] : null };
  }
  const stars = v => { const f = Math.round(v * 2) / 2; return '★'.repeat(Math.floor(f)) + (f % 1 ? '½' : '') + '<span style="opacity:.25">' + '★'.repeat(5 - Math.ceil(f)) + '</span>'; };
  V.comparaison = () => `<section class="view">${head('Comparaison des variantes', 'Six critères notés de 0 à 5 et pondérés ; seules les variantes dans leur domaine d\'emploi SETRA sont classées. Les pondérations sont modifiables.', 'Onglet 12')}
    <div class="card"><h3>Pondération des critères <span class="eyebrow">%</span></h3><div class="card-b"><div class="grid g4">${CRIT.map(([k, l]) => `<div class="fld"><label for="w-${k}">${l}</label><div class="inp"><input id="w-${k}" data-w="${k}" inputmode="numeric" value="${UI.weights[k]}"><span class="u">%</span></div></div>`).join('')}</div></div></div>
    <div data-dyn="comp"></div></section>`;
  function dynComp() {
    const sc = scoreAll();
    const rows = OA.TYPES.map(t => {
      const r = S.R[t.id], o = sc.out[t.id];
      return `<tr class="${t.id === sc.best ? 'best' : ''}"><td><b>${esc(t.short)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(t.name)}</div></td>
        ${CRIT.map(([k]) => `<td title="${esc(o.why[k])}"><span class="stars">${stars(o.s[k])}</span><div style="font-size:11px;color:var(--muted);max-width:190px">${esc(o.why[k])}</div></td>`).join('')}
        <td class="v">${o.tot == null ? '—' : nf(o.tot, 0) + ' %'}${o.tot != null ? `<div class="score-bar"><i style="width:${o.tot}%"></i></div>` : ''}</td><td class="v">${o.rank || '—'}</td><td class="v">${r.rank || '—'}</td></tr>`;

    main.querySelector('[data-dyn="comp"]').innerHTML = `
      <div class="grid g2">

      <div class="card"><h3>Lecture</h3><div class="card-b" style="display:grid;gap:4px;font-size:13px">
        <div>• Adéquation : 5 recommandée, 3 possible, 2 coulé en place dans un lit, 0 hors domaine. Domaine : 5 dans le domaine SETRA, 0 sinon.</div>

        <div>• Coût : 5 × (montant HT le plus faible / montant HT de la variante). Le classement ne remplace pas l'analyse du projeteur (délais, entretien, savoir-faire local).</div></div></div>`;
  }

  /* ---- rapports ---- */
  V.rapports = () => {
    if (!UI.repSel) UI.repSel = S.best ? [S.best] : ['psiba'];
    return `<section class="view">${head('Rapports de conception', 'Choisir une ou plusieurs variantes : le rapport réunit les coupes vectorielles, la note de calcul détaillée et l\'estimation. Téléchargement en PDF (dessins vectoriels) ou en Word.', 'Onglet 13')}
      <div class="card no-print"><div class="card-b" style="display:grid;gap:14px">
        <div><div class="eyebrow" style="margin-bottom:6px">Variantes</div><div class="checks">${OA.TYPES.map(t => `<label class="chk"><input type="checkbox" data-rs="${t.id}"${UI.repSel.includes(t.id) ? ' checked' : ''}>${t.short}${t.id === S.best ? ' ★' : ''}</label>`).join('')}</div></div>
        <div><div class="eyebrow" style="margin-bottom:6px">Contenu</div><div class="checks">${[['draw', 'Coupes longitudinale et transversale'], ['calc', 'Calcul détaillé'], ['est', 'Estimation'], ['comp', 'Comparaison des variantes']].map(([k, l]) => `<label class="chk"><input type="checkbox" data-ro="${k}"${UI.repOpt[k] ? ' checked' : ''}>${l}</label>`).join('')}</div></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn primary" type="button" id="btnPdf">Télécharger le PDF</button><button class="btn steel" type="button" id="btnDocx">Télécharger le Word (.docx)</button>${FRAMED ? '' : '<button class="btn" type="button" id="btnPrint">Imprimer l\'aperçu</button>'}<span id="repMsg" style="font-size:13px;color:var(--muted)"></span></div>
      </div></div>
      <div class="card"><h3>Aperçu du rapport</h3><div class="card-b"><div class="rep-doc" data-dyn="rep"></div></div></div></section>`;
  };
  function projectRows() {
    return [['Intitulé de l\'ouvrage', D.titre], ['Localisation', D.lieu], ['Maître d\'ouvrage', D.mo], ['Établi par', D.auteur], ['Date de l\'étude', new Date(D.date).toLocaleDateString('fr-FR')],
      ['Obstacle franchi', `${D.nature} (${S.dv.cat.toLowerCase()})`], ['Emprise / marge retenue', `${nf(D.emprise)} m / ${nf(S.dv.marge)} m`], ['Longueur à franchir L', nf(S.dv.L) + ' m'],
      ['Largeur du tablier B', nf(S.dv.B) + ` m (${D.nv} voies de ${nf(D.lv)} m, trottoirs : ${D.trot.toLowerCase()})`], ['Hauteurs culées / piles', `${nf(D.Hc)} / ${nf(D.Hp)} m`],
      ['Sol', `${D.sol} – ${D.solType} – qadm ${nf(D.qadm)} MPa – substratum à ${nf(D.substratum)} m – nappe : ${D.nappe.toLowerCase()}`],
      ['Climat', `${D.zoneClim} – ${nf(D.tmin, 0)} / ${nf(D.tmax, 0)} °C – gradient ${nf(D.gradT, 0)} °C – ${D.vent} – ${D.seisme}`],
      ['Environnement', `${D.milieu} – exposition ${D.expo} – enrobage ${nf(D.enrobage, 0)} cm`], ['Frais', `Divers et imprévus ${nf(D.divers, 0)} % – TVA ${nf(D.tva, 0)} %`]];
  }
  function repHTML() {
    const sel = UI.repSel.filter(id => S.R[id]);
    let h = `<h1>Rapport de conception – ${esc(D.titre)}</h1><p style="margin:2px 0 12px;color:#5A6A76">CHAKHARI OA · prédimensionnement selon les guides SETRA · plateforme conçue par M. Maher CHAKHARI</p>
      <h2>1. Données du projet</h2><table>${projectRows().map(([a, b]) => `<tr><th style="width:32%">${esc(a)}</th><td>${esc(b)}</td></tr>`).join('')}</table>`;

    }
    return h;
  }
  function dynRep() { const el = main.querySelector('[data-dyn="rep"]'); if (el) el.innerHTML = UI.repSel.length ? repHTML() : '<p>Choisir au moins une variante.</p>'; }

  /* ---- règles SETRA ---- */

  function svgToPng(str, scale = 2) {
    return new Promise((res, rej) => {
      const vb = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(str), w = +vb[1], h = +vb[2];
      const img = new Image();
      img.onload = () => { const c = document.createElement('canvas'); c.width = w * scale; c.height = h * scale; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? b.arrayBuffer().then(buf => res({ buf, w, h, url: c.toDataURL('image/png') })) : rej(new Error('png')), 'image/png'); };
      img.onerror = () => rej(new Error('Rendu du dessin impossible'));
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str.replace(/font-family="[^"]*"/, 'font-family="Arial, Helvetica, sans-serif"'));
    });
  }
